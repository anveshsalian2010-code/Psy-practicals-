<title>PsyLab Practicals</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: sticky top bar with mode tabs; Units = unit rail + reading column with an animated "plate" on top; other modes centred column */
:root{
  --bg:#f2f3f7; --surface:#ffffff; --ink:#151a2c; --muted:#5b6278; --line:#d9dce6; --grid:#e6e8ef;
  --cog:#2b50e0; --cog-soft:#e3e9ff; --per:#d4462f; --per-soft:#fde6e1; --hl:#ffe66b; --good:#23885a; --bad:#c43d2c;
  --display:"Bricolage Grotesque",system-ui,sans-serif; --body:"Atkinson Hyperlegible",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  --accent:var(--cog); --accent-soft:var(--cog-soft);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1120; --surface:#171b2e; --ink:#e7e9f3; --muted:#9aa1b9; --line:#2a3049; --grid:#161a2c;
  --cog:#88a0ff; --cog-soft:#1f2850; --per:#ff8a73; --per-soft:#3a2026; --hl:#6b5a12; --good:#5fd39a; --bad:#ff8a7a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1120; --surface:#171b2e; --ink:#e7e9f3; --muted:#9aa1b9; --line:#2a3049; --grid:#161a2c;
  --cog:#88a0ff; --cog-soft:#1f2850; --per:#ff8a73; --per-soft:#3a2026; --hl:#6b5a12; --good:#5fd39a; --bad:#ff8a7a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
@media (max-width:520px){dl.terms{grid-template-columns:1fr;gap:2px}dl.terms dd{margin-bottom:8px}}
body{background:var(--bg) linear-gradient(var(--grid) 1px,transparent 1px) 0 0/100% 28px;color:var(--ink);font:16px/1.6 var(--body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px;padding-block:10px}
.logo{font:700 1.3rem var(--display);letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.logo svg{width:26px;height:26px}
nav{display:flex;gap:4px;flex-wrap:wrap}
.btn,nav button{font:700 .9rem var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 14px;border-radius:8px;cursor:pointer}
nav button[aria-selected="true"],.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.prog{margin-left:auto;font:500 .78rem var(--mono);color:var(--muted)}
main{padding-block:26px 70px}
.eyebrow{font:500 .74rem var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
h2{font:700 clamp(1.7rem,4.5vw,2.5rem)/1.1 var(--display);letter-spacing:-.02em;margin:.15em 0 .3em;text-wrap:balance}
h3{font:700 1.15rem var(--display);margin:1.6em 0 .5em}
h4{font:700 .95rem var(--body);margin:1.1em 0 .3em}
mark{background:linear-gradient(transparent 55%,var(--hl) 55%);color:inherit;padding:0 2px}
p{margin:.4em 0 .8em}

.units{display:grid;grid-template-columns:240px minmax(0,1fr);gap:32px}
.rail{display:flex;flex-direction:column;gap:2px;position:sticky;top:76px;align-self:start;max-height:calc(100vh - 90px);overflow:auto}
.rail .grp{font:500 .7rem var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 10px 4px}
.rail button{all:unset;cursor:pointer;padding:7px 10px;border-radius:8px;display:grid;grid-template-columns:44px 1fr auto;gap:6px;font-size:.93rem;align-items:baseline}
.rail button .n{font:500 .72rem var(--mono);color:var(--muted)}
.rail button:hover{background:var(--surface)}
.rail button[aria-current="true"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--c);font-weight:700}
.rail button:focus-visible{outline:3px solid var(--cog)}
.rail .tick{color:var(--good)}
article{min-width:0}
.plate{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:10px 0 20px}
.plate svg{display:block;width:100%;height:auto;max-height:300px}
.plate .cap{font-size:.85rem;color:var(--muted);padding:8px 14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.reading{max-width:70ch}
ul.pts{padding-left:1.15em;display:grid;gap:5px;margin:.3em 0}
dl.terms{display:grid;grid-template-columns:minmax(130px,max-content) 1fr;gap:6px 18px;margin:.4em 0}
dl.terms dt{font-weight:700;color:var(--accent)}
dl.terms dd{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:.4em 0}
.chip{font:500 .78rem var(--mono);background:var(--accent-soft);color:var(--accent);padding:3px 9px;border-radius:99px}
.exp{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 20px 16px;margin:24px 0}
.exp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 24px}
.exp h4{font:500 .72rem var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.exp ol{padding-left:1.2em;margin:.2em 0;display:grid;gap:4px}
.formula{font:500 .92rem var(--mono);background:var(--accent-soft);color:var(--ink);padding:8px 12px;border-radius:8px;display:inline-block;margin:4px 0}
.lab{border:2px dashed var(--accent);border-radius:14px;padding:6px 20px 18px;margin:24px 0;background:color-mix(in srgb,var(--accent-soft) 40%,var(--surface))}
.lab .stage{min-height:120px;display:grid;place-items:center;text-align:center;font:700 clamp(1.6rem,6vw,2.6rem) var(--display);letter-spacing:.08em;background:var(--surface);border-radius:10px;border:1px solid var(--line);margin:10px 0;padding:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
textarea{width:100%;min-height:90px}
.cuegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;width:100%}
.cuegrid label{display:grid;gap:3px;font:500 .75rem var(--mono);color:var(--accent);text-align:left}
.out{font-size:.95rem;margin-top:8px}
.out b{color:var(--accent)}
.verdict{display:inline-block;font:700 .9rem var(--body);padding:4px 12px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.tip{border-left:4px solid var(--hl);background:var(--surface);padding:10px 14px;border-radius:0 10px 10px 0;margin:20px 0;font-size:.95rem}
.done-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:.5em 0}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 12px;border-bottom:1px solid var(--line)}
th{font:500 .7rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
tr:last-child td{border-bottom:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:6px 12px;font:700 .85rem var(--body)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.seg button:focus-visible{outline:3px solid var(--hl)}

/* svg art */
.art text{font-family:var(--body);fill:var(--ink)}
.art .mono{font-family:var(--mono)}
.art .box{fill:var(--surface);stroke:var(--line);stroke-width:2}
.art .acc{fill:var(--accent)} .art .accs{stroke:var(--accent)}
.art .soft{fill:var(--accent-soft)}
.art .mut{fill:var(--muted)}
.art .ln{stroke:var(--line);stroke-width:2;fill:none}
.flow{animation:flow 3.2s linear infinite}
@keyframes flow{0%{transform:translateX(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateX(var(--d,500px));opacity:0}}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.18);opacity:1}}
.draw{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 3.5s ease forwards infinite}
@keyframes draw{0%{stroke-dashoffset:900}60%,100%{stroke-dashoffset:0}}
.bob{animation:bob 4s ease-in-out infinite;transform-box:fill-box}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
/* attention filter states */
.att .un{animation:unB 3.2s linear infinite}
@keyframes unB{0%{transform:translateX(0);opacity:0}8%{opacity:1}40%{transform:translateX(230px);opacity:1}46%{transform:translateX(240px);opacity:0}100%{opacity:0;transform:translateX(240px)}}
.att.treisman .un{animation:unT 3.2s linear infinite}
@keyframes unT{0%{transform:translateX(0);opacity:0}8%{opacity:1}40%{transform:translateX(230px);opacity:1}46%{opacity:.25}92%{opacity:.25}100%{transform:translateX(520px);opacity:0}}
.att.treisman .name,.att.late .un{animation:flow 3.2s linear infinite;--d:520px}
.att .filt{transition:transform .4s}
.att.late .filt{transform:translateX(250px)}

/* cards & quiz */
.center{max-width:660px;margin:0 auto}
.card{perspective:1200px;height:300px;cursor:pointer;margin:16px 0}
.card-in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.card.flip .card-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px;display:flex;flex-direction:column;justify-content:center;gap:10px;overflow:auto}
.face.back{transform:rotateY(180deg);border-color:var(--ink)}
.face .q{font:700 1.4rem/1.3 var(--display);text-wrap:balance}
.hint{font-size:.85rem;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);transition:width .3s}
.opts{display:grid;gap:8px;margin:14px 0}
.opts button{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.opts button:hover:not(:disabled){border-color:var(--ink)}
.opts button:focus-visible{outline:3px solid var(--cog)}
.opts button.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 15%,var(--surface))}
.opts button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--surface))}
.score{font:700 3.4rem var(--display);font-variant-numeric:tabular-nums}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 22px 18px;margin:16px 0;scroll-margin-top:calc(var(--hh,64px) + 64px);min-width:0}
.sec>h3{margin-top:.3em}
.secbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh,64px));z-index:4;display:flex;gap:6px;overflow-x:auto;padding:8px 0;background:var(--bg);margin:0 0 4px}
.secbar button{all:unset;cursor:pointer;white-space:nowrap;font:700 .82rem var(--body);padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface)}
.secbar button:hover{border-color:var(--accent);color:var(--accent)}
.secbar button:focus-visible{outline:3px solid var(--accent)}
blockquote{margin:.4em 0;padding:10px 16px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;font-style:italic}
ol.steps{padding-left:1.3em;display:grid;gap:6px}
.rlist{display:grid;gap:10px}
.rq{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.rq:first-child{border-top:0}
.rq .rn{font:700 1.3rem var(--display);color:var(--accent)}
.rq .say{font:700 1.02rem/1.45 var(--body);margin:6px 0 2px}
.rq .hint{margin:0}
td.mono{font-family:var(--mono)}
#pick{margin-top:14px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;margin-top:16px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px;transition:transform .25s,box-shadow .25s}
.rcard.on{box-shadow:0 0 0 3px var(--hl);transform:translateY(-3px)}
.rcard h3{margin:0;font-size:1.2rem}
.rcard .say{font:700 1.02rem/1.45 var(--body)}
.rcard .lbl{font:500 .68rem var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.rcard p{margin:0;font-size:.93rem}
.rapport-head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}

@media (max-width:780px){
  .units{grid-template-columns:1fr;gap:12px}
  .rail{position:static;flex-direction:row;overflow-x:auto;max-height:none;padding-bottom:6px}
  .rail .grp{display:none}
  .rail button{white-space:nowrap;border:1px solid var(--line);grid-template-columns:auto auto auto;background:var(--surface)}
  .prog{margin-left:0;width:100%}
  header{position:static}
  .card{height:340px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header><div class="wrap">
  <div class="logo"><svg viewBox="0 0 26 26" aria-hidden="true"><circle cx="9" cy="13" r="7" fill="var(--cog)"/><circle cx="17" cy="13" r="7" fill="var(--per)" opacity=".85"/></svg>PsyLab</div>
  <nav role="tablist" aria-label="Study modes">
    <button role="tab" data-mode="intro" aria-selected="true">Viva intros</button>
    <button role="tab" data-mode="exp">Experiments</button>
    <button role="tab" data-mode="rapport">Rapport</button>
    <button role="tab" data-mode="cards">Flashcards</button>
    <button role="tab" data-mode="quiz">Viva quiz</button>
  </nav>
  <div class="prog" id="prog"></div>
</div></header>

<main class="wrap">
  <section id="study" class="units"><div class="rail" id="rail"></div><article id="unit"></article></section>
  <section id="cards" class="center" hidden></section>
  <section id="quiz" class="center" hidden></section>
  <section id="rapport" hidden></section>
</main>

<script>
/* ---------- Animated plates (SVG) ---------- */
const ART = {
cognition:()=>`<svg class="art att" id="attsvg" viewBox="0 0 640 260" role="img" aria-label="Attention filter models animation">
 <text x="20" y="34" class="mono mut" font-size="12">LEFT EAR · attended</text><text x="20" y="184" class="mono mut" font-size="12">RIGHT EAR · unattended</text>
 <rect x="150" y="70" width="120" height="120" rx="12" class="box"/><text x="210" y="125" text-anchor="middle" font-size="14" font-weight="700">Sensory</text><text x="210" y="143" text-anchor="middle" font-size="14" font-weight="700">buffer</text>
 <g class="filt"><rect x="300" y="60" width="16" height="140" rx="6" class="acc"/><text x="308" y="226" text-anchor="middle" class="mono" font-size="12" fill="var(--accent)">FILTER</text></g>
 <rect x="350" y="70" width="130" height="120" rx="12" class="box"/><text x="415" y="125" text-anchor="middle" font-size="14" font-weight="700">Meaning</text><text x="415" y="143" text-anchor="middle" font-size="14" font-weight="700">analysis</text>
 <rect x="510" y="95" width="110" height="70" rx="12" class="soft"/><text x="565" y="135" text-anchor="middle" font-size="14" font-weight="700">Response</text>
 <circle class="flow" style="--d:520px" cx="40" cy="60" r="9" fill="var(--cog)"/><circle class="flow" style="--d:520px;animation-delay:1.1s" cx="40" cy="60" r="9" fill="var(--cog)"/><circle class="flow" style="--d:520px;animation-delay:2.2s" cx="40" cy="60" r="9" fill="var(--cog)"/>
 <circle class="un" cx="40" cy="205" r="9" fill="var(--per)"/><circle class="un" style="animation-delay:1.6s" cx="40" cy="205" r="9" fill="var(--per)"/>
 <g class="un name" style="animation-delay:.8s"><rect x="22" y="194" width="58" height="22" rx="11" fill="var(--per)"/><text x="51" y="210" text-anchor="middle" font-size="11" font-weight="700" fill="var(--surface)">your name</text></g>
</svg>`,
memory:()=>`<svg class="art" viewBox="0 0 640 260" role="img" aria-label="Atkinson-Shiffrin model with information flowing and a serial position curve">
 <rect x="20" y="40" width="150" height="80" rx="12" class="box"/><text x="95" y="76" text-anchor="middle" font-weight="700" font-size="15">Sensory</text><text x="95" y="96" text-anchor="middle" class="mono mut" font-size="11">≤ 2 s · huge</text>
 <rect x="245" y="40" width="150" height="80" rx="12" class="box"/><text x="320" y="76" text-anchor="middle" font-weight="700" font-size="15">STM</text><text x="320" y="96" text-anchor="middle" class="mono mut" font-size="11">20–30 s · 7±2</text>
 <rect x="470" y="40" width="150" height="80" rx="12" class="soft"/><text x="545" y="76" text-anchor="middle" font-weight="700" font-size="15">LTM</text><text x="545" y="96" text-anchor="middle" class="mono mut" font-size="11">years · unlimited</text>
 <path d="M320 40 C 280 0, 360 0, 320 40" class="ln" stroke="var(--accent)"/><text x="320" y="16" text-anchor="middle" class="mono" font-size="11" fill="var(--accent)">rehearsal</text>
 <circle class="flow" style="--d:460px" cx="95" cy="140" r="7" fill="var(--accent)"/><circle class="flow" style="--d:460px;animation-delay:1.6s" cx="95" cy="140" r="7" fill="var(--accent)"/>
 <circle class="flow" style="--d:180px;animation-delay:.8s" cx="95" cy="140" r="7" fill="var(--muted)"/>
 <text x="20" y="168" class="mono mut" font-size="11">attention → encoding → storage → retrieval</text>
 <line x1="330" y1="245" x2="620" y2="245" class="ln"/><line x1="330" y1="175" x2="330" y2="245" class="ln"/>
 <path class="draw" d="M335 185 C 380 230, 420 238, 480 238 S 580 236, 615 182" fill="none" stroke="var(--per)" stroke-width="4" stroke-linecap="round"/>
 <text x="340" y="178" class="mono" font-size="11" fill="var(--per)">primacy</text><text x="560" y="178" class="mono" font-size="11" fill="var(--per)">recency</text>
</svg>`,
cueing:()=>{const n=[[320,130,"FRUIT"],[180,60,"apple"],[460,60,"mango"],[150,200,"grape"],[490,200,"banana"],[320,235,"orange"],[60,130,"red"],[580,130,"yellow"]];
 return `<svg class="art" viewBox="0 0 640 260" role="img" aria-label="Spreading activation from a category cue">
 ${n.slice(1).map(([x,y])=>`<line x1="320" y1="130" x2="${x}" y2="${y}" class="ln"/>`).join("")}
 ${n.map(([x,y,t],i)=>`<g><circle class="pulse" style="animation-delay:${i?0.25*i:0}s" cx="${x}" cy="${y}" r="${i?28:40}" fill="${i?'var(--accent-soft)':'var(--accent)'}"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="${i?13:15}" font-weight="700" ${i?'':'fill="var(--surface)"'}>${t}</text></g>`).join("")}
 <text x="16" y="250" class="mono mut" font-size="11">cue lights up → activation spreads → target recalled</text></svg>`},
chunking:()=>{const L="BGHIEKMON".split("");return `<svg class="art" viewBox="0 0 640 220" role="img" aria-label="Nine letters regroup into three chunks">
 <style>@keyframes ch{0%,25%{transform:translateX(0)}50%,85%{transform:translateX(var(--x))}100%{transform:translateX(0)}}.lt{animation:ch 5s ease-in-out infinite}</style>
 ${L.map((c,i)=>{const g=Math.floor(i/3),x=60+i*58,shift=(g-1)*36;return `<g class="lt" style="--x:${shift}px"><rect x="${x-22}" y="70" width="44" height="56" rx="8" class="${g===1?'soft':'box'}"/><text x="${x}" y="108" text-anchor="middle" font-size="26" font-weight="700" class="mono">${c}</text></g>`}).join("")}
 <text x="320" y="170" text-anchor="middle" font-size="15">9 separate items → <tspan font-weight="700" fill="var(--accent)">3 chunks</tspan> (BGH · IEK · MON)</text>
 <text x="320" y="196" text-anchor="middle" class="mono mut" font-size="11">STM holds 7 ± 2 chunks, not 7 ± 2 bits</text></svg>`},
miq:()=>{const m=[["Visual","see"],["Auditory","hear"],["Gustatory","taste"],["Olfactory","smell"],["Tactual","touch"],["Organic","body"]];
 return `<svg class="art" viewBox="0 0 640 240" role="img" aria-label="Six imagery modalities around a mind">
 <circle cx="320" cy="120" r="46" class="acc"/><text x="320" y="117" text-anchor="middle" fill="var(--surface)" font-weight="700" font-size="14">mental</text><text x="320" y="134" text-anchor="middle" fill="var(--surface)" font-weight="700" font-size="14">image</text>

const INTROS=[
{id:"cognition",kind:"intro",grp:"Viva intros",n:"C",name:"Introduction to Cognition",art:"cognition",cap:"Tap a model to see what the filter lets through.",
 body:`<p><mark>Cognitive psychology is the scientific study of mental processes</mark> such as perception, attention, memory, language, problem-solving and thinking. By viewing the human mind as an <b>active information-processing system</b>, analogous to computational architecture, the discipline seeks to uncover how people acquire, store, transform and communicate knowledge. Rather than treating observable behaviour in isolation, cognitive psychologists investigate internal mental events, using empirical methods like <b>reaction-time tracking, neuroimaging and psychophysiological measures</b> to map out the hidden mechanics of human thought.</p>
 <p>The practical benefits extend far beyond the laboratory, into clinical, educational and technological domains. In clinical settings, cognitive frameworks inform evidence-based interventions like <b>Cognitive Behavioural Therapy (CBT)</b>, which helps people restructure maladaptive thought patterns to reduce emotional distress. In education, understanding memory consolidation, <b>cognitive load theory</b> and attention spans allows educators to design curricula that maximise long-term retention.</p>
 <h3>Perception</h3>
 <p>Perception is the cognitive process by which the brain <mark>organises, integrates and interprets raw sensory input</mark> to construct a meaningful internal representation of the world. Unlike <b>sensation</b>, which is the mere physical detection of stimuli by sensory receptors, perception involves <b>top-down</b> cognitive context and <b>bottom-up</b> sensory data converging to make sense of reality.</p>
 <h4>Major theories of perception</h4>
 <dl class="terms"><dt>Gestalt principles</dt><dd>Max Wertheimer, Kurt Koffka and Wolfgang Köhler. The mind naturally organises sensory elements into unified wholes (gestalts). Core principles: <b>proximity</b> (grouping close elements), <b>similarity</b> (grouping similar items), <b>closure</b> (seeing incomplete figures as complete) and <b>continuity</b> (following smooth paths).</dd>
 <dt>Gibson's ecological theory (direct perception)</dt><dd>James J. Gibson. A bottom-up approach: optical arrays in the environment contain rich, unambiguous information, enough for perception without complex internal processing. Central concept: <mark>affordances</mark>, the actionable properties between the world and an actor (a chair affords sitting).</dd>
 <dt>Gregory's constructivist theory (indirect perception)</dt><dd>Richard Gregory. A top-down view: perception is an active <b>hypothesis-testing</b> process. Because input is often ambiguous, the brain builds perceptual hypotheses from past experience, knowledge and sensory clues.</dd></dl>
 <h4>Types of perception</h4>
 <ul class="pts"><li><b>Visual:</b> interpreting light reflected off surfaces, giving shape, colour, depth and motion.</li><li><b>Auditory:</b> processing frequency and amplitude to identify pitch, timbre, location and speech.</li><li><b>Haptic:</b> actively exploring objects by touch, combining tactile feedback and kinaesthetic awareness.</li><li><b>Olfactory and gustatory:</b> chemical processing of odorants and tastants, combined into flavour.</li></ul>
 <h3>Attention</h3>
 <p>Attention is the cognitive mechanism of <mark>selective concentration</mark>: focusing on specific stimuli while filtering out irrelevant or competing distractions. Because human cognitive capacity is limited, attention acts as a vital processing <b>bottleneck</b>.</p>
 <h4>Types of attention</h4>
 <dl class="terms"><dt>Selective</dt><dd>Focusing on one stream while ignoring distractors, e.g. listening to a friend at a loud party (the <b>Cocktail Party Effect</b>).</dd><dt>Divided</dt><dd>Splitting resources across tasks, e.g. driving while listening to directions.</dd><dt>Sustained (vigilance)</dt><dd>Maintaining focus over a long period, e.g. monitoring radar or security feeds.</dd><dt>Alternating</dt><dd>Shifting focus back and forth between tasks with different demands.</dd></dl>
 <h4>Major theories of attention</h4>
 <dl class="terms"><dt>Broadbent's filter model</dt><dd><b>Early selection.</b> Information passes through a sensory buffer, then a selective filter blocks unattended information based on physical features (pitch, loudness) before meaning is analysed.</dd>
 <dt>Treisman's attenuation model</dt><dd>The filter doesn't block unattended messages, it <b>attenuates</b> (turns down) them. Highly salient words like your own name still break through because their thresholds are permanently low.</dd>
 <dt>Deutsch-Norman model</dt><dd><b>Late selection.</b> All stimuli are analysed for meaning before selection; the bottleneck is just before conscious response.</dd>
 <dt>Kahneman's capacity model</dt><dd>Attention is not a rigid filter but a <b>limited pool of general-purpose resources</b>, allocated flexibly by task demand, arousal and momentary intentions.</dd></dl>
 <h3>Thinking and problem solving</h3>
 <p>Thinking involves the manipulation of mental representations, concepts, symbols and rules. It lets us go beyond immediate sensory data to form generalisations, make inferences and conceptualise abstract ideas.</p>
 <dl class="terms"><dt>Algorithms</dt><dd>Step-by-step logical procedures that <b>guarantee</b> a correct solution if followed (long division).</dd><dt>Heuristics</dt><dd>Mental shortcuts or rules of thumb that speed up decisions but don't guarantee a correct outcome (working backward, means-ends analysis).</dd><dt>Insight</dt><dd>A sudden realisation of the solution without trial and error, studied by Wolfgang Köhler with chimpanzees using tools.</dd></dl>
 <p><b>Barriers:</b> <mark>functional fixedness</mark> (using an object only in its usual way), <mark>mental set</mark> (sticking to a strategy that worked before) and <mark>confirmation bias</mark> (favouring information that supports what you already believe).</p>
 <h3>Learning</h3>
 <p>In cognitive psychology, learning is a <b>relatively permanent change in mental structures, internal representations or behaviour resulting from experience</b>. Unlike strict behaviourist views based on stimulus-response bonds, cognitive theories emphasise active knowledge acquisition, schema development and cognitive maps (Edward Tolman's latent learning). Core paradigms include cognitive constructivism (Piaget), social cognitive learning (Bandura's observational learning) and information-processing models of how input moves through working memory into long-term schemas.</p>
 <h3>Current trends: HCI and UX design</h3>
 <ul class="pts"><li><b>Icons and visual metaphors:</b> use Gestalt grouping and familiar metaphors (a trash can for delete) to lower <b>cognitive load</b>, the mental effort used in working memory.</li><li><b>Affordances in interfaces:</b> from Gibson. Shadows, gradients and hover changes signal that a button is clickable.</li><li><b>Hick's law:</b> decision time increases logarithmically with the number and complexity of choices, so designers use progressive disclosure.</li><li><b>Attention-driven design:</b> visual hierarchy, contrast, whitespace and motion guide focus to the call-to-action.</li></ul>`,
 tip:"Filter models by where selection happens: <b>Broadbent (early) → Treisman (attenuated) → Deutsch-Norman (late)</b>. Kahneman is the odd one: no filter, just a resource pool."},
{id:"memory",kind:"intro",grp:"Viva intros",n:"M",name:"Introduction to Memory",art:"memory",cap:"Grey dot = attended but not rehearsed, so it's lost from STM.",
 body:`<p>Memory is one of the fundamental cognitive processes through which information is <mark>encoded, retained, organised and later retrieved</mark>. It lets us learn from experience, acquire knowledge, recognise people and objects, develop skills, solve problems, communicate and keep a sense of personal identity. Without memory, experiences would remain isolated events with little influence on later behaviour.</p>
 <p>Memory is not a passive storage box. It is a continuous interaction between attention, perception, encoding, storage, retrieval and existing knowledge. Information may be transformed, organised, linked to prior knowledge, kept for varying periods and <b>reconstructed</b> during recall. It has traditionally been studied through the <b>information-processing approach</b> (mind as computer), which dominated cognitive psychology in the 1950s–1970s.</p>
 <h3>Definitions and key contributors</h3>
 <dl class="terms"><dt>Hermann Ebbinghaus</dt><dd>One of the first to study memory experimentally, using <b>nonsense syllables</b>. Showed retention changes systematically over time and practice improves learning. Made memory a laboratory topic, not just a philosophical one.</dd>
 <dt>William James</dt><dd><b>Primary memory</b> (immediately in consciousness) vs <b>secondary memory</b> (not conscious now but can be brought back). Anticipated the STM / LTM split.</dd>
 <dt>Frederic Bartlett</dt><dd>Memory is <mark>constructive</mark>: not a literal copy but a reconstruction using knowledge, expectations and <b>schemas</b>.</dd>
 <dt>Atkinson & Shiffrin (1968)</dt><dd>The three-store or <b>modal model</b>: sensory memory → short-term memory → long-term memory, with <b>control processes</b> such as rehearsal.</dd>
 <dt>Baddeley & Hitch</dt><dd>Replaced passive STM with <b>working memory</b>, a limited system that holds and manipulates information during tasks.</dd>
 <dt>Endel Tulving</dt><dd>LTM is not one system: <b>episodic</b> (personally experienced events) vs <b>semantic</b> (general knowledge, facts, meanings).</dd></dl>
 <h3>Characteristics of memory</h3>
 <ul class="pts"><li><b>Encoding:</b> turning input into a form that can be stored (visually, verbally or semantically).</li><li><b>Storage:</b> keeping it over time: fractions of a second (sensory), seconds (STM) or decades (LTM).</li><li><b>Retrieval:</b> accessing it through recall, recognition, relearning or implicit effects.</li><li><b>Organisation:</b> associations, categories, schemas and networks.</li><li><b>Reconstruction:</b> knowledge and expectations shape what is remembered.</li></ul>
 <h3>Memory systems</h3>
 <div class="tbl"><table><thead><tr><th>System</th><th>Duration</th><th>Capacity</th><th>Key points</th></tr></thead><tbody>
 <tr><td>Sensory</td><td>~2 s or less</td><td>Very large</td><td><b>Iconic</b> (visual; sparkler trail; Sperling's partial-report experiments) and <b>echoic</b> (auditory; catching the last words someone said)</td></tr>
 <tr><td>Short-term</td><td>20–30 s without rehearsal</td><td>7 ± 2 chunks (Miller, 1956)</td><td>Limited, vulnerable to interference, kept alive by rehearsal. Brown–Peterson paradigm shows rapid loss</td></tr>
 <tr><td>Working</td><td>Seconds</td><td>Limited</td><td>Storage + processing for reasoning, reading, mental arithmetic, planning</td></tr>
 <tr><td>Long-term</td><td>Minutes to years</td><td>Extremely large</td><td>Multiple systems</td></tr></tbody></table></div>
 <h4>Types of long-term memory</h4>
 <ul class="pts"><li><b>Explicit / declarative</b> (can be consciously reported): <mark>episodic</mark> (your first day at college, yesterday's breakfast) and <mark>semantic</mark> (Delhi is the capital of India, 2 + 2 = 4).</li><li><b>Implicit / nondeclarative</b> (shown without conscious recollection): procedural memory (cycling, typing, tying shoelaces), priming, classical conditioning, habituation, sensitisation. Procedural memory can stay intact even when declarative memory is impaired.</li></ul>
 <h3>Models of memory</h3>
 <h4>Atkinson–Shiffrin modal model</h4><p class="formula">Sensory register → Short-term store → Long-term store</p>
 <p><b>Control processes</b> (rehearsal, attention, coding, retrieval strategies, organisation) decide what happens to information, so it doesn't move automatically. Later research showed STM is more complex than one store, working memory manipulates information, LTM has multiple systems and the flow isn't simply linear.</p>
 <h4>Levels of processing (Craik & Lockhart, 1972)</h4>
 <p>How <b>deeply</b> information is processed matters more than which store holds it. <b>Structural</b> (“Is the word in capitals?”) → <b>phonemic</b> (“Does it rhyme with CAT?”) → <b>semantic</b> (“Can it be eaten?”). Deeper processing gives more durable traces.</p>
 <h4>Working memory model (Baddeley & Hitch, 1974)</h4>
 <dl class="terms"><dt>Central executive</dt><dd>Supervisor: directs attention, allocates resources, coordinates components, switches tasks, plans, monitors, integrates.</dd><dt>Phonological loop</dt><dd>Phonological store + subvocal rehearsal (repeating a phone number silently).</dd><dt>Visuospatial sketchpad</dt><dd>Visual, spatial information and mental images (picturing the route to the library).</dd><dt>Episodic buffer</dt><dd>Added later by Baddeley (2000). Integrates the loop, sketchpad and LTM into one coherent representation.</dd></dl>
 <h4>Tulving's multiple memory systems</h4><p>Episodic memory is organised around personal events and time; semantic memory around meaning and concepts. This led to the modern view of memory as multiple interacting systems.</p>
 <h3>Serial position effect</h3>
 <p>Free recall of a list depends on position, giving a <b>U-shaped curve</b>. <mark>Primacy effect</mark>: early items get more rehearsal and transfer to LTM. <mark>Recency effect</mark>: the last items are still in STM at immediate recall. Middle items are recalled worst.</p>
 <h3>Processes of memory</h3>
 <p class="formula">Attention → Encoding → Consolidation → Storage → Retrieval → Reconstruction</p>
 <ul class="pts"><li><b>Attention</b> is the gateway; unattended input fades from sensory memory.</li><li><b>Encoding:</b> visual, phonological, semantic or motor coding.</li><li><b>Rehearsal:</b> <i>maintenance</i> (plain repetition of a phone number) vs <i>elaborative</i> (linking to meaning, like relating “episodic memory” to your own life).</li><li><b>Consolidation:</b> new information becomes stable in LTM; Sternberg calls it integrating new with stored information.</li><li><b>Retrieval:</b> <i>recall</i> (produce it) vs <i>recognition</i> (identify it; more cues, so easier).</li><li><b>Forgetting:</b> <i>decay</i> (trace fades) and <i>interference</i> (other information blocks it). Often the information is still there, just without a cue.</li><li><b>Reconstruction:</b> schemas, expectations and context can distort memories, which matters for eyewitness testimony.</li></ul>`,
 tip:"Years to remember: <b>Atkinson & Shiffrin 1968</b>, <b>Craik & Lockhart 1972</b>, <b>Baddeley & Hitch 1974</b> (+ episodic buffer 2000), <b>Miller 1956</b>."},
{id:"personality",kind:"intro",grp:"Viva intros",n:"P",name:"Introduction to Personality",art:"personality",cap:"From the Latin persona, an actor's mask.",
 body:`<p>The term “personality” comes from the Latin <mark>“persona”</mark>, the theatrical mask worn by actors in Greek dramas. Psychologists agree that personality goes beyond the roles people play, though there is no single accepted definition. Theorists, shaped by their own backgrounds and experiences, have developed unique theories and perspectives.</p>
 <p><b>APA definition:</b> Personality is “the enduring configuration of characteristics and behavior that comprises an individual's unique adjustment to life, including major traits, interests, drives, values, self-concept, abilities, and emotional patterns.” It is a complex, dynamic integration shaped by heredity and constitution, physical maturation, early training, identification with significant individuals and groups, culturally conditioned values and roles, and critical experiences and relationships.</p>
 <p><b>Allport (1937):</b> “Personality is the <mark>dynamic organization</mark> within the individual of those <mark>psychophysical systems</mark> that determine his unique adjustments to the environment.”</p>
 <p>Personality is a pattern of <b>relatively permanent traits and unique characteristics</b> that give consistency and individuality to behaviour. Traits explain individual differences, consistency over time and stability across situations. Characteristics include temperament, physique and intelligence. So personality is the distinct pattern of traits and characteristics that define how we consistently think, feel and behave.</p>
 <h3>Different approaches to personality</h3>
 <h4>Carl Rogers: person-centred</h4><p>Focuses on subjective experience, self-concept and an innate tendency to grow. Every person has an <b>actualizing tendency</b> (Rogers, 1951). Key ideas: the perceived self vs the ideal self, <b>unconditional positive regard</b> (valuing someone without conditions) and <b>conditions of worth</b>, which cause <b>incongruence</b> between self-concept and experience. The <b>fully functioning person</b> is open to experience, trusts their feelings and lives freely. Therapy rests on empathy, genuineness and unconditional positive regard.</p>
 <h4>Abraham Maslow: humanistic</h4><p>Maslow (1908–1970) emphasised human potential and growth. His <b>hierarchy of needs</b>: physiological → safety → belongingness and love → esteem → self-actualization. Lower needs usually need some satisfaction before higher ones dominate. Self-actualizers show self-acceptance, creativity, independence and realistic perception.</p>
 <h4>Carl Jung: analytical psychology</h4><p>Libido is general life energy, not just sexual. The psyche has the <b>conscious</b> (ego), <b>personal unconscious</b> (forgotten or repressed experiences) and <b>collective unconscious</b> (inherited universal patterns, the <b>archetypes</b>). Attitudes: introversion and extraversion. Functions: thinking, feeling, sensation, intuition. Archetypes: <b>persona</b> (social face), <b>shadow</b> (hidden side), <b>anima/animus</b>, and the <b>Self</b> (wholeness). A <b>complex</b> is a cluster of emotionally linked thoughts and memories. <b>Individuation</b> integrates conscious and unconscious.</p>
 <h4>Alfred Adler: individual psychology</h4><p>Inferiority feelings are normal and motivating; if not overcome they form an <b>inferiority complex</b> (from physical weakness, pampering, neglect). Overcompensation can create a <b>superiority complex</b>. Key ideas: <b>striving for superiority</b>, <b>fictional finalism</b> (imagined future goals guide behaviour), <b>style of life</b>, <b>creative self</b>, four lifestyles (dominant, getting, avoiding, socially useful), <b>social interest</b> and <b>birth order</b>. Methods: birth-order analysis, early recollections, dream analysis. Criticism: hard to test; birth-order findings are inconsistent.</p>
 <h4>Gordon Allport: trait theory</h4><p>Adults aren't prisoners of childhood; he stressed uniqueness, conscious motives and the present. <b>Individual traits</b> (unique) vs <b>common traits</b> (shared in a culture). Personal dispositions: <b>cardinal</b> (pervasive, shapes a whole life), <b>central</b> (core characteristics) and <b>secondary</b> (less consistent preferences). <b>Functional autonomy</b>: adult motives become independent of the childhood drives they grew from.</p>
 <h4>Raymond Cattell: factor-analytic trait theory</h4><p>Personality is “that which permits a prediction of what a person will do in a given situation.” Used <b>factor analysis</b>. <b>Surface traits</b> (visible clusters) vs <b>source traits</b> (stable underlying factors), which are <b>constitutional</b> (biological) or <b>environmental-mold</b>. Functional groups: ability, temperament and dynamic traits (innate <b>ergs</b>, learned <b>sentiments</b>). Data: <b>L-data</b> (life records), <b>Q-data</b> (questionnaires), <b>T-data</b> (objective tests). Found <b>16 source traits</b> → the 16PF.</p>
 <h4>Hans Eysenck: biological dimensions</h4><p>Personality is stable and largely biological and genetic, organised hierarchically from specific acts to broad superfactors. First two independent dimensions: <b>extraversion–introversion</b> and <b>neuroticism–stability</b>; later <b>psychoticism–control</b> (cruelty, hostility, insensitivity), giving the three-factor model. Rooted in heredity, CNS arousal and hormones.</p>
 <h4>Erik Erikson: psychosocial theory</h4><p>Development across the whole lifespan through 8 stages, each a crisis: Trust vs Mistrust (infancy), Autonomy vs Shame & Doubt (early childhood), Initiative vs Guilt (preschool), Industry vs Inferiority (school age), Identity vs Role Confusion (adolescence), Intimacy vs Isolation (young adulthood), Generativity vs Stagnation (middle adulthood), Ego Integrity vs Despair (late adulthood).</p>
 <h3>Factors influencing personality</h3>
 <dl class="terms"><dt>Genetic</dt><dd>Eysenck's P, E, N; McCrae & Costa's <b>Big Five</b> (N, E, O, A, C); Buss & Plomin's temperaments (emotionality, activity, sociability); Zuckerman's sensation seeking. Twin studies support it. Genes give predispositions, not fixed outcomes.</dd>
 <dt>Environmental</dt><dd>Adler: birth order and family. Horney: culture and gender. Allport: genetics is the raw material, environment shapes it. Erikson: social and historical forces. Also parenthood, marriage, divorce, jobs, stress, culture, neighbourhood.</dd>
 <dt>Learning</dt><dd>Skinner: reinforcement and conditioning. Bandura: observational learning, vicarious reinforcement, <b>self-efficacy</b>. Rotter: <b>locus of control</b>. Seligman: <b>learned helplessness</b> and optimism. A sense of control → better coping, self-esteem, less anxiety.</dd>
 <dt>Parental</dt><dd>Freud first stressed it. Adler: rejection and neglect. Horney: parental warmth → security. Erikson: first-year bond → basic trust. Maslow: physiological and safety needs. Rogers: unconditional positive regard. <b>Authoritative parenting</b> → greater competence and adjustment. Children also influence parents, and parenting is partly heritable.</dd>
 <dt>Developmental</dt><dd>Freud: fixed by age 5–6. Cattell, Allport, Erikson: can change later. Five-factor traits fairly stable after 30. With age people become more conscientious, agreeable and stable; N, E and O decline slightly.</dd>
 <dt>Consciousness</dt><dd>Most theorists give conscious processes a role. Kelly: <b>personal constructs</b> to predict events. Bandura: observing others and anticipating consequences.</dd>
 <dt>Unconscious</dt><dd>Freud: store of repressed wishes. Modern cognitive psychology confirms processing outside awareness (subliminal research), but this “cognitive unconscious” is more rational than Freud's.</dd></dl>`,
 tip:"Definitions examiners ask most: <b>Allport 1937</b> (dynamic organisation… psychophysical systems) and <b>Cattell</b> (prediction of what a person will do in a given situation)."}

{id:"cueing",kind:"exp",grp:"Experiments",n:"1",name:"Cueing on Recall",art:"cueing",cap:"Spreading activation (Collins & Loftus, 1975).",lab:"cueLab",
 intro:`<p><b>Recall</b> is a form of memory retrieval where a person must <mark>actively reproduce information learned earlier</mark>, without it being presented again. This differs from <b>recognition</b>, where the person only identifies previously seen material from options (like multiple choice). Recall is generally harder and more effortful than recognition because it requires searching memory rather than matching against a cue.</p>
 <p>There are several sub-types of recall. <b>Free recall</b> involves recalling items in any order without assistance. <b>Serial recall</b> requires recalling items in the exact order presented. <b>Cued recall</b> gives a hint or prompt (cue) to help retrieve the target information.</p>
 <p><mark>Cueing</mark> is providing a stimulus, such as a word, category label, image, sound, smell or environmental context, that is associated with a target memory, to help a person retrieve it. Memories are not stored as isolated facts but as <b>networks of associations</b>, and a cue can “unlock” a pathway to a memory that would otherwise be hard to reach. Cued recall experiments study how and why prompts improve retrieval, and what this tells us about how information is stored and organised.</p>
 <h3>Development of the tool</h3>
 <p><b>Hermann Ebbinghaus (1885)</b> was the first to study memory experimentally. He used lists of nonsense syllables and measured recall and relearning speed. He didn't use cueing directly, but his controlled word-list method became the basis for all later recall research, including cued recall.</p>
 <p><b>Early associationist psychologists</b> (late 1800s–early 1900s) proposed that ideas are linked, so activating one idea (a cue) can trigger a linked idea (the target). This groundwork later became testable in the laboratory.</p>
 <p><b>Mary Whiton Calkins</b>, in the early 1900s, developed <b>paired-associate learning</b>: participants learn word pairs (“dog–chair”) and are later given the first word as a cue for the second. This is one of the earliest formal cued recall tasks.</p>
 <p><b>Tulving and Pearlstone (1966)</b> compared free and cued recall using categorised word lists (furniture, animals). Giving category names at test significantly increased recall, showing that <mark>cueing helps retrieval, not just storage</mark>.</p>
 <p><b>Tulving and Thomson (1973)</b> proposed the <b>Encoding Specificity Principle</b>: a cue works only if it matches the way information was encoded. This remains the dominant explanation of why some cues work and others don't.</p>
 <p><b>Godden and Baddeley (1975)</b> extended cueing to environmental context. Deep-sea divers recalled word lists better when tested in the same environment (underwater or on land) where they learned them, showing cues need not be verbal. Cued recall is now used across cognitive, clinical (memory disorders), developmental (ageing) and educational psychology.</p>
 <h3>Theories behind the tool</h3>
 <dl class="terms"><dt>Encoding specificity</dt><dd>Tulving & Thomson (1973). Retrieval is better when cues at recall match those at encoding. A cue isn't good or bad in itself; it depends on the match.</dd>
 <dt>Spreading activation</dt><dd>Collins & Loftus (1975). Memory is a network of concepts; activating one spreads to related ones, making them easier to retrieve.</dd>
 <dt>Generate–recognise</dt><dd>Two stages: the cue generates possible items, then the person recognises the correct one.</dd>
 <dt>Context-dependent memory</dt><dd>Recall improves when the internal state or external context matches learning. Reinstating context acts as a cue.</dd>
 <dt>Levels of processing</dt><dd>Craik & Lockhart (1972). Deeper, meaningful processing forms stronger traces; shallow processing (sound only) forms weaker ones.</dd></dl>
 <h3>Applications</h3>
 <p>In <b>education</b>, headings, keywords and mnemonics act as cues during revision and exams. In <b>eyewitness testimony</b>, the cognitive interview uses contextual and retrieval cues. In <b>clinical and rehabilitation</b> settings, cued recall helps assess and support people with memory impairments. In <b>advertising</b>, jingles, slogans, colours and logos cue brand recall. In <b>everyday life</b>, we use categorised grocery lists, acronyms and first-letter mnemonics.</p>`,
 aim:"To study the effect of cueing on recall.",hyp:"Cueing has a positive effect on recall.",
 plan:"The experiment is conducted in two series: Series 1 – Free recall and Series 2 – Cued recall. Recall under the two conditions is compared, each given in a separate series.",

{id:"chunking",kind:"exp",grp:"Experiments",n:"2",name:"Chunking",art:"chunking",cap:"Same letters, fewer units to hold.",lab:"chunkLab",
 intro:`<p><mark>Chunking</mark> is a memory strategy in which individual pieces of information are grouped into larger, meaningful units called “chunks”, to increase how much can be held in short-term or working memory at one time. Instead of remembering many small, unrelated pieces, the mind organises them into fewer, larger and more meaningful units that are easier to remember and retrieve.</p>
 <p>For example, the letters <b>B-G-H-I-E-K-M-O-N</b> are nine separate items. Grouped as <b>BGH-IEK-MON</b>, they become three chunks. Chunking works because STM is limited by the <b>number of units</b> it can hold, not necessarily the total amount of information. Combining small units into fewer, meaningful groups lets more information be retained.</p>
 <p>Chunking is closely related to <b>STM span</b>, the number of items a person can hold and recall immediately. It shows that span can be improved through strategic organisation of information, not through an actual increase in capacity.</p>
 <h3>Development of the tool</h3>
 <p><b>George A. Miller (1956)</b> is most closely associated with chunking. In “The Magical Number Seven, Plus or Minus Two: Some Limits on Our Capacity for Processing Information”, he reviewed earlier memory-span and judgment research and suggested STM holds about <mark>7 ± 2 items or chunks</mark>, regardless of how much each chunk contains.</p>
 <p>Miller didn't run the original experiments himself. He brought together earlier findings such as Wechsler's digit span tests and studies of absolute judgment. But he was the first to formally name the <b>“chunk”</b> as a unit of memory, distinct from a <b>“bit”</b> of information. His key idea: capacity is limited by the number of chunks, not the information inside them, so reorganising information into larger meaningful units lets us remember much more within the same capacity.</p>
 <p>After Miller, researchers designed experiments on chunking. Digit and letter span tasks were modified to compare random sequences with sequences that could be grouped. <b>Bower, Clark, Lesgold and Winzenz (1969)</b> showed that organising word lists into hierarchical categories greatly improved free recall compared with random lists.</p>
 <p><b>Chase and Simon (1973)</b> studied chess players. Experts remembered board positions far better than beginners when pieces were in <b>realistic game patterns</b> (meaningful chunks), but the advantage <b>disappeared with random arrangements</b>. This became the most cited real-world example of chunking and expertise. Chunking is now important in memory research, expertise, education, artificial intelligence and cognitive models of memory.</p>
 <h3>Theories behind the tool</h3>
 <dl class="terms"><dt>Miller's magic number (1956)</dt><dd>STM holds about 7 ± 2 chunks regardless of chunk size. Memory limits became a fixed number of organised units, not individual items.</dd>
 <dt>Working memory model</dt><dd>Baddeley & Hitch (1974). Chunking relates to the limited <b>phonological loop</b>; denser chunks let it hold more within the same capacity.</dd>
 <dt>LTM interaction theory</dt><dd>Chunking depends on knowledge in LTM. “NASA” is one unit only if you know the acronym. Explains why experts chunk better.</dd>
 <dt>Template theory</dt><dd>Gobet & Simon (1996). Experts build larger, flexible <b>templates</b> in LTM to encode complex information quickly, like a grandmaster seeing familiar patterns.</dd>
 <dt>Capacity limitation theory</dt><dd>STM is a limited number of <b>slots</b> for meaningful units, not a fixed amount of raw information.</dd></dl>
 <h3>Applications</h3>
 <p>In <b>education</b>, students divide dates, formulas and vocabulary into meaningful groups. <b>Phone numbers, ID numbers and passwords</b> are split into small groups. In <b>language learning</b>, learning common phrases rather than single words helps recall and fluency. In <b>human-computer interaction</b>, instructions are organised into steps or categories to reduce mental effort. Chunking is also used in <b>memory rehabilitation</b> and in cognitive training for children and older adults.</p>`,
 aim:"To study the effect of chunking on recall.",hyp:"Chunking increases the efficiency of recall.",
 plan:"Conduct the experiment in two series: without chunking and with chunking. Present each stimulus string for two seconds and measure immediate free recall.",

 <h4>Conclusion</h4><p>Chunking had a positive effect on the participant's efficiency of recall (average span 8.0 vs 5.5); the hypothesis is supported.</p>`,

{id:"miq",grp:"Experiments",kind:"exp",n:"3",name:"Mental Imagery Questionnaire",art:"miq",cap:"Six sub-tests, 15 items each.",lab:"miqLab",
 intro:`<p><mark>Mental imagery</mark> is the ability to form and experience internal representations of objects, events, sensations or situations <b>in the absence of the actual external stimulus</b>. In simple terms, it is mentally experiencing something not currently present to the senses: imagining your childhood home, hearing a familiar song in your mind, or feeling what it's like to walk along a beach. Imagery is closely related to perception because both represent sensory information, though imagery occurs without direct stimulation. Research suggests imagery shares functional characteristics with perception and is involved in memory, thinking, problem-solving, emotion and behaviour.</p>
 <p>Imagery is not only visual. People differ in the <b>clarity, vividness and ease</b> with which they generate mental experiences. Some form highly detailed images; others experience imagery less vividly. Imagery can involve different senses, letting us recreate sounds, smells, tastes, bodily sensations and movements. This makes imagery important for understanding <b>individual differences</b> in cognitive functioning.</p>
 <h3>Development of the tool</h3>
 <p>Questionnaire measures of imagery go back to <b>Betts' Questionnaire upon Mental Imagery (1909)</b>, which asked people to rate how vividly they could imagine items in several senses. <b>Sheehan (1967)</b> shortened it to 35 items across seven modalities (visual, auditory, cutaneous, kinaesthetic, gustatory, olfactory, organic), rated from “very vivid and clear as in reality” to “no image”. The MIQ used in the lab follows this tradition with <b>15 items in each of six sensory areas</b>, rated on a six-point scale.</p>
 <h3>Six modalities of mental imagery</h3>
 <dl class="terms"><dt>Visual</dt><dd>Colours, shapes, objects, people, places, like the appearance of a familiar classroom.</dd><dt>Auditory</dt><dd>Sounds, like hearing a person's voice or a piece of music in your mind.</dd><dt>Tactile (tactual)</dt><dd>Touch, pressure, texture, temperature or physical contact.</dd><dt>Olfactory</dt><dd>Smells, like perfume or freshly prepared food.</dd><dt>Gustatory</dt><dd>Tastes, like lemon or chocolate.</dd><dt>Kinaesthetic / organic</dt><dd>Movement or bodily states, like running, stretching, hunger or fatigue. The MIQ sub-test is called <b>organic (bodily)</b>.</dd></dl>
 <p>Measures of imagery across several senses show that imagery is a <b>multisensory</b> rather than purely visual phenomenon.</p>
 <h3>Theories of mental imagery</h3>
 <dl class="terms"><dt>Paivio's dual coding theory</dt><dd>Two interacting systems: <b>verbal</b> and <b>non-verbal imagery</b>. Information coded in both is easier to remember because there are two routes to it. The word “apple” has a verbal label and an image.</dd>
 <dt>Kosslyn's depictive theory</dt><dd>Visual images contain <b>spatial information</b> and can be manipulated like perception: you can mentally scan or rotate an imagined object. Imagery shares measurable processes with perception.</dd>
 <dt>Pylyshyn's propositional approach</dt><dd>The picture-like feel of imagery doesn't mean the mind stores literal pictures; information may be stored in an abstract, <b>propositional</b> form. Kosslyn vs Pylyshyn = the <mark>imagery debate</mark>.</dd></dl>
 <h3>Applications</h3>
 <p>In <b>memory and learning</b>, imagery helps encode and retrieve information, especially when words are paired with meaningful images. In <b>sports psychology</b>, athletes mentally rehearse movements before performing them. In <b>clinical psychology</b>, mental images are involved in emotions and disorders, and imagery-based techniques are used in interventions. Imagery also supports <b>problem-solving, creativity, planning and decision-making</b>, since people can mentally manipulate objects and outcomes before acting. Assessing imagery tells us how individuals differ in experiencing and using internal representations.</p>`,
 aim:"To assess the sensory experience of an individual in six areas: visual, auditory, gustatory, olfactory, tactual and bodily.",hyp:"Mental imagery has a positive effect on recall.",
 plan:"To administer the questionnaire according to the instructions in the manual and score each item on the six-point Likert scale across six sub-tests. Interpretation is done as per the norms given in the manual.",
 materials:["Mental Imagery Questionnaire","Writing materials","Manual and norms for interpretation"],

{id:"solat",grp:"Experiments",kind:"exp",n:"4",name:"Styles of Learning and Thinking (SOLAT)",art:"solat",cap:"Hemisphericity = preference, not proof of brain dominance.",lab:"solatLab",
 intro:`<h3>Hemisphericity</h3>
 <p><mark>Hemisphericity</mark> refers to an individual's preference for processing information through one cerebral hemisphere, or through both in an integrated manner. The brain is divided into two cerebral hemispheres connected mainly by the <b>corpus callosum</b>. Although the hemispheres work together, research on <b>cerebral lateralisation</b> shows certain functions are more strongly represented in one hemisphere. Language is predominantly lateralised to the <b>left</b> hemisphere in most people, whereas visuospatial processing is more associated with the <b>right</b>. These functions aren't completely restricted to one side, and both hemispheres continuously interact during normal cognition.</p>
 <h3>Theory of cerebral lateralisation</h3>
 <p>Hemispheric specialisation was strongly influenced by research on <b>split-brain patients</b>. <b>Roger Sperry, Michael Gazzaniga, Joseph Bogen</b> and colleagues showed the hemispheres could perform certain functions differently when communication between them was disrupted. These findings clarified functional specialisation and the role of the corpus callosum in integrating information between hemispheres.</p>
 <h3>Development of SOLAT</h3>
 <p>Based on these findings, researchers proposed that individuals differ in their preferred ways of processing information. <b>Torrance et al. (1977)</b> developed <b>Your Style of Learning and Thinking (SOLAT)</b>, a self-report measure of preferences associated with left-hemisphere, right-hemisphere or integrated modes. The tool assumes the <mark>left hemisphere</mark> is more involved in <b>verbal, analytical, sequential and logical</b> processing, and the <mark>right hemisphere</mark> in <b>holistic, spatial, visual and non-verbal</b> processing.</p>
 <p>The <b>Indian version</b> was developed and standardised by <b>D. Venkataraman (1994)</b>. It has <b>50 items</b> and gives scores for right-hemisphere preference, left-hemisphere preference and integrated (whole-brain) functioning. It identifies a person's predominant information-processing preference, <b>not</b> general intelligence or ability.</p>
 <div class="tbl"><table><thead><tr><th>Left hemisphere style (L)</th><th>Right hemisphere style (R)</th></tr></thead><tbody><tr><td>Verbal, logical</td><td>Visual, holistic</td></tr><tr><td>Sequential, step by step</td><td>Spatial, sees overall patterns</td></tr><tr><td>Analytical, detail-oriented</td><td>Intuitive, imaginative, non-linear</td></tr><tr><td>Systematic organisation</td><td>Creative associations</td></tr></tbody></table></div>
 <h3>Applications</h3>
 <p>SOLAT is used in educational and psychological research on individual differences in learning and thinking: links between hemispheric preference and <b>academic achievement, learning strategies, problem-solving, classroom preferences</b> and information-processing patterns. Results should be interpreted cautiously because the test does not directly measure brain activity.</p>
 <h3>Limitations of the left-brain / right-brain approach</h3>
 <p>Modern research supports functional specialisation and lateralisation, but calling people simply “left-brained” or “right-brained” is an <mark>oversimplification</mark>. Both hemispheres take part in most complex activities. Psychometric research on the original SOLAT also found insufficient evidence for sorting people into fixed left- or right-brain styles. SOLAT is best understood as a measure of <b>reported learning and thinking preferences</b>, not a neurological measure of dominance.</p>`,
 aim:"To assess the dominance of the hemisphere in the styles of learning and thinking by administering the SOLAT tool.",hyp:null,
 plan:"To administer the tool according to the instructions in the manual and score items using the scoring key. Interpretation of scores is done as per the norms given in the manual.",
 materials:["SOLAT tool","Manual","Norms for interpretation","Writing material"],vars:null,
 instr:"“Please read the following statements carefully. Each statement has two parts, A and B, followed by boxes. Put a tick mark in the box for whichever statements are true for you. You may tick both statements if both in a pair are true for you, or you may leave both if neither is true for you.”",
 proc:["The tool uses simple sentences and can be given from 8th standard students up to postgraduates.","Arrange and maintain good testing conditions throughout.","Give the instructions.","The subject records responses on the test sheet and checks that marks are firm, so hemisphere dominance can be assessed correctly."],
 prec:["Give instructions clearly","Help the subject with the meaning of difficult words","Administer to students of 8th standard and above","Make sure tick marks are firm and clear"],
 scoring:`<div class="tbl"><table><thead><tr><th>Response</th><th>Counted as</th></tr></thead><tbody><tr><td>Statement (a) ticked</td><td><b>R</b> (right)</td></tr><tr><td>Statement (b) ticked</td><td><b>L</b> (left)</td></tr><tr><td>Both ticked</td><td><b>I / W</b> (integrated / whole)</td></tr><tr><td>Neither ticked</td><td>Not counted</td></tr></tbody></table></div>
 <p>Count totals of R, L and W. Convert each raw score to a <b>sten score</b> and interpret as high, average or low using the norms. <mark>Hemisphere dominance = the category with the highest score.</mark></p>`,

 <h4>Discussion pointers</h4><ul class="pts"><li>Right (28, sten 7): preference for visual, holistic, intuitive, imaginative, non-linear processing.</li><li>Left (11, sten 4): uses logical, sequential, analytical strategies to a moderate extent, but less preferred.</li><li>Whole (9, sten 5): moderate ability to combine both.</li><li>Add the caution that this is a preference, not literal brain dominance.</li></ul>
 <h4>Conclusion</h4><p>The results indicate right hemisphere dominance in the subject's style of learning and thinking.</p>`,

{id:"pf16",grp:"Experiments",kind:"exp",n:"5",name:"16 Personality Factors (16PF)",art:"pf16",cap:"Sten 1–10, population mean 5.5.",lab:"stenLab",
 intro:`<h3>Personality</h3><p>Personality refers to <mark>individual differences in characteristic patterns of thinking, feeling and behaving</mark>. It reflects how a person consistently interacts with their environment and others, shaped by both biological and environmental influences.</p>
 <h3>Trait theories of personality</h3>
 <dl class="terms"><dt>Gordon Allport</dt><dd>Emphasised the uniqueness of each personality. Traits at three levels: <b>cardinal</b> (dominate and shape behaviour), <b>central</b> (basic characteristics found to varying degrees in everyone) and <b>secondary</b> (situation-dependent). Traits are stable and shape motivation and action.</dd>
 <dt>Raymond Cattell</dt><dd>Developed the <b>16PF Questionnaire</b> to measure 16 primary traits. Used <b>factor analysis</b> to identify them as the building blocks of personality, giving a detailed, quantitative model of individual differences.</dd>
 <dt>Hans Eysenck</dt><dd>Three dimensions: extraversion vs introversion, neuroticism vs stability, and later psychoticism vs socialisation. Focused on the biological bases of traits.</dd>
 <dt>Big Five / Five-Factor Model</dt><dd>Openness, Conscientiousness, Extraversion, Agreeableness and Neuroticism. A widely accepted framework for comparing personality across cultures.</dd></dl>
 <h3>The 16 Personality Factor Questionnaire</h3>
 <p>The 16PF was developed by British-American psychologist <b>Raymond Cattell</b>. Using factor analysis on a large pool of trait descriptions, he identified <mark>16 primary personality traits (source traits)</mark> that form the foundation of human personality. Surface traits are the visible clusters of behaviour; source traits are the deeper factors behind them. The 16PF assesses these traits through a self-report questionnaire, widely used in healthcare, employment, counselling and research.</p>
 <div class="tbl"><table><thead><tr><th>Factor</th><th>Name</th><th>What it measures</th></tr></thead><tbody>
 ${[["A","Warmth","Friendliness and affection vs detachment"],["B","Reasoning","Abstract thinking and intelligence"],["C","Emotional stability","Calmness vs emotional reactivity"],["E","Dominance","Assertiveness and control vs submission"],["F","Liveliness","Enthusiasm and spontaneity"],["G","Rule-consciousness","Adherence to rules, conscientiousness"],["H","Social boldness","Confidence in social situations"],["I","Sensitivity","Emotional sensitivity and tenderness"],["L","Vigilance","Suspicion vs trustfulness"],["M","Abstractedness","Imagination and abstract thinking"],["N","Privateness","Discretion and reserve"],["O","Apprehension","Self-doubt and anxiety"],["Q1","Openness to change","Receptiveness to new experiences"],["Q2","Self-reliance","Independence and self-sufficiency"],["Q3","Perfectionism","Organisation and thoroughness"],["Q4","Tension","Restlessness and impatience"]].map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</tbody></table></div>
 <h3>Second-order factors</h3>
 <p>Broader dimensions derived from the primary traits that summarise personality structure:</p>
 <dl class="terms"><dt>Extraversion</dt><dd>Outgoing, sociable, enjoys interaction.</dd><dt>Anxiety</dt><dd>Emotional instability, nervousness, susceptibility to stress.</dd><dt>Tough poise</dt><dd>Resilience, calmness and confidence under pressure.</dd><dt>Independence</dt><dd>Self-reliant, assertive, prefers autonomy.</dd><dt>Control</dt><dd>Self-discipline, organisation, impulse regulation.</dd><dt>Adjustment</dt><dd>Staying emotionally stable and coping with stress.</dd><dt>Leadership</dt><dd>Dominance, influence, taking charge.</dd><dt>Creativity</dt><dd>Openness, originality, imagination.</dd></dl>
 <h3>Applications</h3>
 <p>Used in <b>career counselling</b> to identify suitable vocational paths; in <b>clinical assessment</b> for information about emotional and behavioural characteristics; in <b>personnel selection</b> and HR to match profiles to job requirements; in <b>leadership development and team building</b>; in <b>research</b> on personality structure and outcomes; and in <b>couples counselling</b> to understand personality differences in relationships.</p>`,
 aim:"To assess the source traits and surface traits of individuals using the 16PF Questionnaire.",hyp:null,
 plan:"To administer the 16PF Questionnaire according to the manual, score responses with the stencil keys, convert raw scores to sten scores, and interpret the 16 primary and the second-order factors using the norms.",
 materials:["16PF Questionnaire","Answer sheet","16PF test profile","Manual","Scoring template (stencils)","Writing materials"],vars:null,

 <p class="hint">Table 2: second-order factor scores</p><div class="tbl"><table><thead><tr><th>Second-order factor</th><th>Score</th><th>Sten</th><th>Interpretation</th></tr></thead><tbody><tr><td>Extraversion</td><td>1.9</td><td>2</td><td>Low</td></tr><tr><td>Anxiety</td><td>6.3</td><td>6</td><td>Average</td></tr><tr><td>Tough poise</td><td>6.1</td><td>6</td><td>Average</td></tr><tr><td>Independence</td><td>4.1</td><td>4</td><td>Low</td></tr></tbody></table></div>
 <h4>Discussion pointers</h4><ul class="pts"><li>Go factor by factor: “For Factor A: Warmth, the subject obtained a raw score of 2 and a sten of 1, interpreted as Low. This indicates…”</li><li>Explain second-order factors from the primaries (e.g. low extraversion comes from low A, F and H).</li><li>End with an integrated personality picture.</li></ul>
 <h4>Conclusion</h4><p>The subject presents as analytical, conscientious and rule-abiding, introverted and guarded socially, accommodating, with balanced emotional stability.</p>`,

{id:"epq",grp:"Experiments",kind:"exp",n:"6",name:"Eysenck's Personality Questionnaire–Revised (EPQ-R)",art:"epq",cap:"E and N are independent axes. P was added later.",lab:"epqLab",
 intro:`<h3>Personality</h3><p>Personality is a pattern of <b>relatively permanent traits and characteristics</b> that gives consistency and individuality to a person's behaviour (Feist & Feist, 2009). It includes differences in how people think, feel and behave, and explains why people respond differently to similar situations. Personality psychologists therefore use standardised inventories to assess stable characteristics; these are useful when they show adequate <b>reliability and validity</b>.</p>
 <h3>Eysenck's theory and the EPQ-R</h3>
 <p>The EPQ-R is a self-report inventory based on <b>Hans J. Eysenck's trait and biological theory</b>. Eysenck proposed that personality can be understood through a small number of broad, relatively independent dimensions. His final model had three: <mark>Psychoticism (P), Extraversion (E) and Neuroticism (N)</mark>, the <b>P-E-N model</b>. These are continuous dimensions, not fixed categories, so people fall at different points along each.</p>
 <h3>Development of the tool</h3>
 <p class="formula">MPI → EPI → EPQ (1975) → EPQ-R (1985)</p>
 <p>The <b>Maudsley Personality Inventory (MPI)</b> came first and measured E and N. The <b>Eysenck Personality Inventory (EPI)</b> continued E and N and added a <b>Lie scale</b> to identify socially desirable responding. Eysenck and Eysenck then developed the <b>EPQ</b>, published in <b>1975</b>, which added <b>Psychoticism</b>; it had adult and junior forms.</p>
 <p>The <b>EPQ-R</b> mainly aimed to improve the psychometric properties of the P scale. <b>Eysenck, Eysenck and Barrett (1985)</b> added new items to improve the P scale's internal reliability, widen the score range and make the distribution closer to normal. Four short 12-item scales (P, E, N, L) were also developed. The full EPQ-R has <b>100 items</b>; the short form has <b>48</b> (12 per scale).</p>
 <h3>Major dimensions</h3>
 <dl class="terms"><dt>Extraversion (E)</dt><dd>From extraversion to introversion. High scorers are sociable, lively, active, assertive, venturesome and impulsive; low scorers are quieter and more reserved. Eysenck saw E as one of the strongest, most consistently observed dimensions.</dd>
 <dt>Neuroticism (N)</dt><dd>Emotional instability vs stability. High scorers show more anxiety, moodiness, tension, guilt and emotional reactivity; low scorers are calmer. N is a dimension of <b>normal</b> personality, not a mental disorder.</dd>
 <dt>Psychoticism (P)</dt><dd>Added later. High scores: aggressiveness, impulsiveness, egocentricity, coldness, nonconformity, reduced empathy. Low end: socialisation, empathy, cooperation, conformity. Doesn't mean the person is psychotic.</dd>
 <dt>Lie (L)</dt><dd>Detects socially desirable responding, which matters because the test relies on self-report. Present since the EPI.</dd></dl>
 <h3>Indian version and adaptation</h3>
 <p><b>Laungani (1985)</b> compared EPQ results from <b>558 Indian men and 636 Indian women</b> with the English standardisation sample. Factor analysis showed close correspondence (factor comparison indices above <b>.97</b>), with only slightly lower reliabilities. Some items that didn't work in India were replaced using items from the 101-item Indian version.</p>
 <p>The <b>Hindi EPQ-R Short Form (EPQRS-H)</b> by <b>Tiwari, Singh and Singh (2009)</b> was translated and back-translated, then given to <b>202 Hindi-speaking students at Banaras Hindu University</b>. E, N and L showed satisfactory reliability; <b>P was less satisfactory</b>.</p>
 <h3>Applications</h3>
 <p>Used in clinical and health psychology, education, occupational settings and personality research: psychopathology, learning, creativity, social behaviour, criminality and health behaviours.</p>
 <h3>Limitations</h3>
 <p>The P scale has weaker psychometric properties than E and N. Studies report restricted ranges, skewed scores and item-functioning differences across groups. The three-factor model is broad and may miss traits captured by the Five-Factor Model.</p>`,
 aim:"To assess the personality of the participant using Eysenck's Personality Questionnaire–Revised.",hyp:null,
 plan:"To administer the EPQ-R to assess the characteristics of the subject on the three dimensions (P, E, N) and the Lie scale.",
 materials:["Eysenck's Personality Questionnaire–Revised (EPQ-R)","Manual of EPQ-R","Stencil of EPQ-R","Writing materials"],vars:null,
 instr:"“Answer each question by putting a mark in the box for ‘Yes’ or ‘No’. Give the first response that comes to your mind. There are no right or wrong answers and no trick questions. Work quickly and do not think too long about the exact meaning of the question.”",
 proc:["Seat the subject comfortably and establish rapport.","Give the EPQ-R and the instructions.","The subject marks Yes or No for each question on the answer sheet.","Collect the answer sheet once all items are answered."],

 scoring:`<ul class="pts"><li>Score with the EPQ-R <b>stencils</b>. Each keyed answer gets <b>1 mark</b>. Add page totals for P, E, N and L to get <b>raw scores</b>.</li><li>Convert raw scores to <b>sten scores</b> using the manual.</li><li>Sten <b>5–6</b> = average strength of the factor; <b>1–4</b> = gradual decrease of strength; higher = greater strength.</li><li><b>Lie scale:</b> a score of <mark>7+ in males or 8+ in females</mark> means the results are rejected clinically (for academic practice they're still calculated).</li></ul>

{id:"neo",grp:"Experiments",kind:"exp",n:"7",name:"NEO Five-Factor Inventory-3 (NEO-FFI-3)",art:"neo",cap:"Five broad domains, no facets.",lab:"neoLab",
 intro:`<h3>Personality</h3><p>Personality is a pattern of relatively permanent traits and unique characteristics that give <b>consistency and individuality</b> to behaviour. Traits contribute to individual differences, consistency over time and stability across situations. Characteristics include temperament, physique and intelligence.</p>
 <h3>About the NEO-FFI-3</h3>
 <p>The <mark>NEO Five-Factor Inventory-3</mark> is a concise <b>60-item</b> instrument assessing the five major domains of personality. It is a short-form revision of the original NEO-FFI, <b>replacing 15 items</b> to improve readability and psychometric properties for people aged <b>12 and older</b>. It uses five <b>12-item scales</b> to measure each domain broadly, without the underlying facets. There are two parallel forms: <b>Form S</b> for self-reports and <b>Form R</b> for observer ratings by peers, spouses or experts.</p>
 <h3>Theories behind the NEO-FFI-3</h3>
 <p>The NEO-FFI-3 is rooted in the <b>trait perspective</b>, which identifies, measures and classifies stable behavioural dispositions. Traits are treated as <b>continuous, normally distributed dimensions</b> along a bell curve, not rigid clinical categories. The main framework is the <mark>Five-Factor Model (FFM)</mark>, which grew from the <b>lexical tradition</b> of Gordon Allport and Raymond Cattell and was developed into a full theory by <b>Robert McCrae and Paul Costa Jr.</b></p>
 <dl class="terms"><dt>Five-Factor Theory (FFT)</dt><dd>Separates <b>basic tendencies</b> (biologically rooted traits) from <b>characteristic adaptations</b> (how traits show up as habits, behaviours and attitudes shaped by the environment). Traits are stable, endogenous and strongly influenced by genetics.</dd>
 <dt>Hierarchical structure</dt><dd>Broad domains sit at the top, supported by specific <b>facets</b> below. The full NEO-PI-3 measures facets; the NEO-FFI-3 samples only the broad domains for an efficient overview.</dd>
 <dt>Consensual and construct validation</dt><dd>A person's self-schema (Form S) can be validated against observer ratings (Form R). Comparing them tests evaluative bias, self-insight and cross-observer agreement.</dd></dl>
 <h3>The five major factors</h3>
 <dl class="terms"><dt>Neuroticism (N)</dt><dd>Emotional stability vs instability. High scorers are prone to distress and negative affect (anxiety, sadness, anger) and maladaptive coping. Low scorers are calm, even-tempered, resilient.</dd>
 <dt>Extraversion (E)</dt><dd>Sociability, activity, energy. Extraverts are outgoing, assertive, talkative and responsive to excitement and reward. Introverts prefer solitude and are reserved and independent.</dd>
 <dt>Openness to Experience (O)</dt><dd>Cognitive flexibility and curiosity: active imagination, aesthetic appreciation, receptivity to feelings, willingness to question tradition. Closed people prefer convention and familiar routines.</dd>
 <dt>Agreeableness (A)</dt><dd>Interpersonal tendencies and trust. High scorers are empathetic, cooperative, altruistic and avoid conflict. Low scorers (antagonistic) are competitive, sceptical and self-focused.</dd>
 <dt>Conscientiousness (C)</dt><dd>Impulse control, organisation and willpower. High scorers are purposeful, organised, scrupulous, punctual and goal-driven. Low scorers are casual and easily distracted.</dd></dl>
 <h3>Applications</h3>
 <p>In <b>counselling, psychiatry and clinical psychology</b>, the profile helps understand clients, formulate diagnoses, build empathy, choose treatments and anticipate the course of therapy. In <b>industrial/organisational psychology and vocational counselling</b>, it supports career placement and job profiling. It is also used in research on <b>educational psychology, behavioural genetics, cross-cultural studies and health psychology</b>.</p>`,
 aim:"To assess the personality of the subject by administering the NEO Five-Factor Inventory.",hyp:null,
 plan:"Administer the scale to the subject. The answer sheet is given and the subject's responses are recorded. Scoring and interpretation are done based on the norms.",
 materials:["NEO Five-Factor Inventory booklet","Manual","Norms","Writing materials"],vars:null,

 proc:["Seat the subject comfortably and establish good rapport.","Give the instructions.","Administer the questionnaire; the subject marks one of five options from strongly disagree to strongly agree.","Collect the answer sheet once all 60 items are answered."],

 <h4>Discussion pointers</h4><ul class="pts"><li>Go domain by domain: raw score, T-score, band, then meaning.</li><li>Link to rapport observations (the record notes the subject's sociability matched very high E, while her own view of agreeableness didn't match her low score).</li><li>Don't forget Openness in the discussion. The record's discussion skips it.</li></ul>
 <h4>Conclusion</h4><p>The subject is very high in Extraversion, high in Openness, average in Neuroticism and Conscientiousness, and low in Agreeableness.</p>`,
