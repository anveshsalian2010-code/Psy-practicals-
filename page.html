{id:"bell",grp:"Experiments",kind:"exp",n:"8",name:"Bell's Adjustment Inventory",art:"bell",cap:"High score = poor adjustment in that area.",lab:"bellLab",
 intro:`<p>According to the <b>American Psychological Association</b>, adjustment refers to <mark>“a change in attitude, behavior, or both by an individual on the basis of some recognized need or desire to change, particularly to account for the current environment or changing, atypical, or unexpected conditions.”</mark></p>
 <h3>Adjustment disorders</h3>
 <p>Adjustment disorders are mental health conditions triggered by emotional or behavioural responses to <b>stressful events</b> such as financial trouble, medical issues or relationship conflict. Symptoms typically appear <b>within three months</b> of the stressor and may include anxiety, depression or behavioural changes.</p>
 <p>They affect <b>2% to 8%</b> of the population and are more common in women and adolescents, often due to academic challenges, family conflict or substance use. In adults, triggers include marital and financial problems, with high prevalence among hospitalised patients facing health stressors. Age, personality, cultural background and psychodynamic factors (early relationships, defence mechanisms) shape vulnerability.</p>
 <h3>Diagnosis and clinical features</h3>
 <p>Adults often show depressive or anxious features, or both. Behaviour may include reckless driving, substance use, withdrawal and insomnia. <b>DSM-5</b> describes six types:</p>
 <dl class="terms"><dt>With depressed mood</dt><dd>Tearfulness, sadness, hopelessness. Distinguish from major depression and bereavement.</dd><dt>With anxiety</dt><dd>Agitation, palpitations, jitteriness. Distinguish from anxiety disorders.</dd><dt>With mixed anxiety and depressed mood</dt><dd>Features of both, not meeting other disorders' criteria.</dd><dt>With disturbance of conduct</dt><dd>Violating norms or others' rights; distinct from conduct disorder or antisocial personality disorder.</dd><dt>With mixed disturbance of emotions and conduct</dt><dd>Emotional disturbance plus behavioural misconduct.</dd><dt>Unspecified</dt><dd>Atypical reactions such as extreme denial, social withdrawal or non-compliance with treatment.</dd></dl>
 <h3>The adjustment inventory</h3>
 <p><b>Bell's Adjustment Inventory (Adult Form)</b> measures personal and social adjustment in <mark>five areas: home, health, social, emotional and occupational</mark>. <b>High scores indicate unsatisfactory adjustment; low scores indicate satisfactory adjustment.</b> A high home score suggests difficulty with the home environment; high health, social, emotional or occupational scores suggest poor health habits, social withdrawal, emotional instability or job dissatisfaction.</p>
 <p>It is an effective tool in <b>adult counselling</b>: separate measures let counsellors compare individuals and pinpoint problem areas. It is <b>self-administering</b>, with clear instructions and a completion time of about <b>25 minutes</b>. Counsellors should secure cooperation, address concerns openly and keep results confidential.</p>
 <h3>Reliability and validity</h3>
 <p><b>Reliability</b> coefficients range from <b>0.81 to 0.94</b> across sections, obtained with the <b>Spearman-Brown formula</b> on employed individuals aged 23–28. <b>Validity</b> was established through careful item selection and by differentiating extreme cases identified by experienced counsellors from various counselling bureaus and institutions.</p>
 <p>By identifying adjustment difficulties, the inventory helps adults achieve better self-understanding and resolve personal and social challenges.</p>`,

 <h4>Conclusion</h4><p>The subject has good occupational adjustment, average home and social adjustment, unsatisfactory health adjustment and very unsatisfactory emotional adjustment, with an overall average level of adjustment.</p>`,

INTROS.push({id:"viva",kind:"intro",grp:"Viva intros",n:"V",name:"Viva essentials",art:"scores",cap:"Same person, four ways to say where they stand.",lab:"scoreLab",
 body:`<p>The stuff examiners ask about <b>every</b> practical: timing, score types, biology, MD and what each test is actually for.</p>
 <h3>Stopwatch & standardisation</h3><ul class="pts"><li>The stopwatch times <b>presentation, recall, response and rest</b> so every participant gets the same conditions.</li><li>Reset before starting, know which event starts and stops it, record the time immediately, no extra cues during a timed trial.</li><li><mark>Standardisation</mark> = same instructions, same procedure for everyone. It cuts examiner-caused variation.</li><li>Timed practicals: cueing (2 s/word, 3 min recall, 5 min rest), chunking (2 s/card, 15 s recall, 5 min rest, 10 cards), Bell's (~25 min). MIQ has no time limit.</li></ul>
 <h3>Observation</h3><p>Note cooperation, attention, confusion, interruptions, fatigue, odd response patterns. Write it <b>objectively</b>: "looked away several times during presentation", not "was careless". Observation supports scoring, it never replaces it.</p>
 <h3>Score conversions</h3><div class="tbl"><table><thead><tr><th>Score</th><th>Meaning</th><th>Formula / scale</th></tr></thead><tbody>
 <tr><td>Raw</td><td>Direct score before norms</td><td>Means nothing alone</td></tr>
 <tr><td>z</td><td>Distance from mean in SD units</td><td>z = (X − M) / SD</td></tr>
 <tr><td>T</td><td>Mean 50, SD 10</td><td>T = 50 + 10z</td></tr>
 <tr><td>Sten</td><td>Standard ten, mean 5.5, SD 2</td><td>1–2 very low · 3–4 low · 5–6 avg · 7–8 high · 9–10 very high</td></tr>
 <tr><td>Percentile</td><td>% of norm group at or below you</td><td>75th percentile ≠ 75% marks</td></tr></tbody></table></div>
 <h3>Biological basis (safe viva wording)</h3><dl class="terms"><dt>Extraversion</dt><dd>Eysenck: extraverts have <b>lower baseline cortical arousal</b>, so they seek stimulation.</dd><dt>Neuroticism</dt><dd>Linked to emotional / autonomic reactivity and stress sensitivity. Normal dimension, not a disorder.</dd><dt>Psychoticism</dt><dd>Biologically influenced cluster: impulsive, nonconforming, tough-minded. Doesn't mean psychosis.</dd><dt>Big Five / 16PF</dt><dd>Genetic influences, but expression is shaped by learning and culture. No single brain area per factor.</dd><dt>Memory & attention</dt><dd>Distributed networks (hippocampus / medial temporal lobe for memory). Imagery recruits perception systems.</dd></dl>
 <p class="formula">"The trait has biological and genetic correlates, but it emerges from multiple interacting systems and environmental influences."</p>
 <h3>16PF Motivational Distortion (MD)</h3><p>In Forms C/D, <mark>MD flags faking good</mark> or overly favourable self-presentation. Score the MD items with the Form C key, sum to a raw score, interpret with the form's manual. A high MD <b>doesn't automatically invalidate</b> the profile and isn't proof of lying.</p>
 <h3>Utility of each test</h3><div class="tbl"><table><thead><tr><th>Test</th><th>Purpose</th><th>Practical use</th></tr></thead><tbody>
 <tr><td>Cueing</td><td>Effect of cues on retrieval</td><td>Prompts in memory support, rehab</td></tr><tr><td>Chunking</td><td>Effect of grouping on recall</td><td>Breaking study material into units</td></tr><tr><td>MIQ</td><td>Vividness of imagery</td><td>Imagery rehearsal, relaxation, guided imagery</td></tr><tr><td>SOLAT</td><td>Learning-thinking preference</td><td>Study strategy counselling</td></tr><tr><td>16PF</td><td>16 factors</td><td>Counselling, career guidance, HR</td></tr><tr><td>EPQ-R</td><td>P, E, N + Lie</td><td>Sociability, reactivity, response style</td></tr><tr><td>NEO-FFI-3</td><td>Big Five</td><td>Coping and interpersonal patterns, treatment planning</td></tr><tr><td>Bell's</td><td>5 adjustment areas</td><td>Spotting areas to explore in counselling</td></tr></tbody></table></div>
 <h3>Quick-fire answers</h3><dl class="terms"><dt>Can a test diagnose alone?</dt><dd>No. Use it with interview, history, observation and context.</dd><dt>Trait vs state</dt><dd>Stable tendency vs temporary condition.</dd><dt>Is a high score always good?</dt><dd>No. Depends on construct, scale direction and norms.</dd><dt>Forgot a cut-off?</dt><dd>State the scoring principle, say the exact cut-off is in the manual. <b>Don't guess.</b></dd><dt>Why rapport?</dt><dd>Comfort, understanding of instructions, cooperation. It helps but doesn't guarantee honest answers.</dd></dl>`,
 tip:"If you blank on a number in the viva, the guide's line is gold: <b>\"The principle is X; the exact cut-off is in the test manual.\"</b> Examiners prefer that to a wrong guess."});

scoreLab(el){
 el.innerHTML=`<p>Enter a raw score with the norm group's mean and SD. Try the guide's example: mean 50, SD 10, raw 70.</p>
 <div class="row"><label>Raw X <input type="number" id="zx" value="70" style="width:90px"></label><label>Mean <input type="number" id="zm" value="50" style="width:90px"></label><label>SD <input type="number" id="zs" value="10" min="0.1" step="0.1" style="width:90px"></label></div><div class="out" id="zo"></div>`;
 const cdf=z=>{const t=1/(1+.2316419*Math.abs(z)),d=.3989423*Math.exp(-z*z/2),p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p};
 const upd=()=>{const x=+$("#zx").value,m=+$("#zm").value,s=+$("#zs").value;if(!(s>0)){$("#zo").textContent="SD must be above 0.";return}
  const z=(x-m)/s,T=50+10*z,st=Math.min(10,Math.max(1,Math.round(5.5+2*z))),pc=Math.round(cdf(z)*100);
  $("#zo").innerHTML=`z = (${x} − ${m}) / ${s} = <b>${z>=0?"+":""}${z.toFixed(2)}</b> · T = 50 + 10z = <b>${T.toFixed(0)}</b> · sten ≈ <b>${st}</b> · percentile ≈ <b>${pc}</b><br><span class="hint">Approximate, assuming a normal distribution. Real tests use their own norm tables.</span>`};
 el.querySelectorAll("input").forEach(i=>i.oninput=upd);upd();
},
cueLab(el){
 const A=["window","river","pencil","garden","doctor","candle","bottle","engine","forest","mirror","ladder","button"];
 const CAT={Fruits:["mango","grape","banana"],Animals:["tiger","rabbit","horse"],Colours:["purple","yellow","orange"],Furniture:["table","sofa","shelf"]};
 const B=shuffle(Object.values(CAT).flat());
 let a=null;
 el.innerHTML=`<p>Mini version of Experiment 1. 12 words per list, shown for 1.5 s each. Series 1 is free recall, Series 2 gives you category cues.</p>
 <div class="stage" id="cs">Ready?</div><div id="cin"></div><div class="row"><button class="btn primary" id="cgo">Start Series 1</button></div><div class="out" id="cout"></div>`;
 const show=async(list)=>{const id=++runId;$("#cgo").disabled=true;$("#cin").innerHTML="";for(const w of list){if(id!==runId)return false;$("#cs").textContent=w;await wait(1500)}$("#cs").textContent="Recall now";return id===runId};
 $("#cgo").onclick=async()=>{
  if(a===null){ if(!await show(shuffle(A)))return;
   $("#cin").innerHTML=`<label for="cfree" class="hint">Type every word you remember, any order</label><textarea id="cfree"></textarea>`;
   $("#cgo").disabled=false;$("#cgo").textContent="Score & start Series 2";$("#cfree").focus();a=-1; }
  else if(a===-1){ a=countHits($("#cfree").value,A); if(!await show(B))return;
   $("#cin").innerHTML=`<div class="cuegrid">${Object.keys(CAT).map(c=>`<label>${c}<input data-c="${c}" aria-label="${c} words"></label>`).join("")}</div>`;
   $("#cgo").disabled=false;$("#cgo").textContent="Score Series 2";$("#cin input").focus(); }
  else { const typed=[...document.querySelectorAll("#cin input")].map(i=>i.value).join(" "); const b=countHits(typed,B);
   $("#cout").innerHTML=`Series 1 (free): <b>${a}/12</b> · Series 2 (cued): <b>${b}/12</b> · Difference = ${b} − ${a} = <b>${b-a}</b><br><span class="verdict">${b>a?"Cueing helped, hypothesis supported":"No cueing benefit this time"}</span>`;
   $("#cgo").textContent="Run again";a=null;$("#cs").textContent="Ready?";$("#cin").innerHTML=""; }
 };
},
chunkLab(el){
 const C="BCDFGHJKLMNPRSTVZ",V="AEIOU",r=s=>s[Math.random()*s.length|0],cvc=()=>r(C)+r(V)+r(C);
 const make=()=>{const s=[],k=[];for(let i=0;i<4;i++){s.push(cvc()+cvc()+cvc());k.push(cvc()+"-"+cvc()+"-"+cvc())}return [...s.map(x=>[x,0]),...k.map(x=>[x,1])]};
 let trials,i,score;
 el.innerHTML=`<p>Mini version of Experiment 2: 4 strings without chunks, then 4 chunked. Each shows for 2 s. Type the letters in order (use _ for a letter you forgot).</p>
 <div class="stage mono" id="ks">BGH-IEK-MON</div><div class="row"><input id="kin" class="mono" autocomplete="off" aria-label="Letters you saw" placeholder="type letters" disabled><button class="btn primary" id="kgo">Start</button></div><div class="out" id="kout"></div>`;
 const next=async()=>{const id=++runId;if(i>=trials.length){const n=score[0]/4,c=score[1]/4;$("#ks").textContent="Done";$("#kout").innerHTML=`Average span: non-chunked <b>${n.toFixed(1)}</b> · chunked <b>${c.toFixed(1)}</b> · D = <b>${(c-n).toFixed(1)}</b><br><span class="verdict">${c>n?"Chunking improved recall":"No chunking benefit this run"}</span>`;$("#kgo").textContent="Run again";$("#kgo").disabled=false;$("#kin").disabled=true;i=-1;return}
  $("#kin").value="";$("#kin").disabled=true;$("#kgo").disabled=true;$("#ks").textContent="●";await wait(600);if(id!==runId)return;
  $("#ks").textContent=trials[i][0];await wait(2000);if(id!==runId)return;$("#ks").textContent=`Card ${i+1}/8 · type it`;$("#kin").disabled=false;$("#kin").focus();$("#kgo").disabled=false;$("#kgo").textContent="Submit";};
 const submit=()=>{const want=trials[i][0].replace(/-/g,""),got=$("#kin").value.toUpperCase().replace(/[^A-Z_]/g,"");let s=0;for(let k=0;k<9;k++)if(got[k]===want[k])s++;score[trials[i][1]]+=s;$("#kout").textContent=`Card ${i+1}: ${s}/9 letters in the right position`;i++;next()};
 $("#kgo").onclick=()=>{if(!trials||i===-1){trials=make();i=0;score=[0,0];$("#kout").textContent="";next()}else submit()};
 $("#kin").onkeydown=e=>{if(e.key==="Enter"&&!$("#kin").disabled)submit()};
},

solatLab(el){
 const P=[["I like to solve problems by looking at the whole picture","I like to solve problems step by step"],["I remember faces easily","I remember names easily"],["I prefer drawing or diagrams","I prefer written instructions"],["I go with hunches","I go with logic"],["I like open-ended tasks","I like tasks with clear rules"]];

 <div class="tbl"><table><thead><tr><th>#</th><th>Statement A</th><th>Statement B</th></tr></thead><tbody>${P.map(([a,b],k)=>`<tr><td>${k+1}</td><td><label><input type="checkbox" id="sa${k}"> ${a}</label></td><td><label><input type="checkbox" id="sb${k}"> ${b}</label></td></tr>`).join("")}</tbody></table></div><div class="out" id="sout"></div>`;
 const upd=()=>{let R=0,L=0,W=0;P.forEach((_,k)=>{const a=$("#sa"+k).checked,b=$("#sb"+k).checked;if(a&&b)W++;else if(a)R++;else if(b)L++});const m=Math.max(R,L,W);const d=m===0?"tick some boxes":[R===m?"Right":null,L===m?"Left":null,W===m?"Whole":null].filter(Boolean).join(" / ");$("#sout").innerHTML=`R = <b>${R}</b> · L = <b>${L}</b> · W = <b>${W}</b> → dominance: <span class="verdict">${d}</span>`};
 el.querySelectorAll("input").forEach(s=>s.onchange=upd);upd();
},

let filt="all",deck=[],ci=0,again=[];
function buildDeck(list){deck=list||shuffle(CARDS.filter(c=>filt==="all"||c[2]===filt));ci=0;again=[];drawCard()}
function drawCard(){
 document.documentElement.style.setProperty("--accent","var(--cog)");document.documentElement.style.setProperty("--accent-soft","var(--cog-soft)");
 let h=`<div class="eyebrow">Flashcards</div><h2>Recall first, then flip</h2><div class="row"><select id="dsel" aria-label="Unit">${`<option value="all">All units (${CARDS.length})</option>`+U.map(u=>`<option value="${u.id}" ${filt===u.id?"selected":""}>${u.n} ${u.name}</option>`).join("")}</select><button class="btn" id="shuf">Shuffle</button></div>`;
 if(!deck.length)h+=`<p class="hint">No cards for this unit yet.</p>`;
 else if(ci>=deck.length)h+=`<div class="face" style="position:static;margin:16px 0;min-height:180px"><div class="q">Deck done</div><div>${deck.length-again.length} of ${deck.length} known.${again.length?` ${again.length} to review.`:" Clean sweep."}</div></div><div class="row">${again.length?'<button class="btn primary" id="redo">Review the ones I missed</button>':""}<button class="btn" id="restart">Start over</button></div>`;
 else{const c=deck[ci],u=U.find(x=>x.id===c[2]);h+=`<div class="bar" style="margin-top:16px"><i style="width:${ci/deck.length*100}%"></i></div>
  <div class="card" id="card" tabindex="0" role="button" aria-label="Flip card"><div class="card-in"><div class="face"><span class="eyebrow">${u.name} · ${ci+1}/${deck.length}</span><div class="q">${c[0]}</div><span class="hint">Tap or press Space to flip</span></div><div class="face back"><span class="eyebrow">Answer</span><div>${c[1]}</div></div></div></div>
  <div class="row"><button class="btn" id="miss">Still learning (←)</button><button class="btn primary" id="got">Got it (→)</button></div>`}
 $("#cards").innerHTML=h;
 $("#dsel").onchange=e=>{filt=e.target.value;buildDeck()};$("#shuf").onclick=()=>buildDeck();
 if(!deck.length)return;
 if(ci>=deck.length){$("#restart").onclick=()=>buildDeck();if(again.length)$("#redo").onclick=()=>buildDeck(shuffle(again));return}
 $("#card").onclick=()=>$("#card").classList.toggle("flip");
 $("#got").onclick=()=>{ci++;drawCard()};$("#miss").onclick=()=>{again.push(deck[ci]);ci++;drawCard()};
}
document.addEventListener("keydown",e=>{if($("#cards").hidden||!$("#card")||e.target.matches("input,select,textarea"))return;if(e.code==="Space"){e.preventDefault();$("#card").classList.toggle("flip")}if(e.key==="ArrowRight")$("#got")?.click();if(e.key==="ArrowLeft")$("#miss")?.click()});

/* ---------- Viva quiz ---------- */
const QUIZ=[

["Who proposed spreading activation?",["Tulving & Thomson","Craik & Lockhart","Collins & Loftus","Baddeley & Hitch"],2,"Collins & Loftus, 1975."],
["Chunking average span is calculated as…",["Total letters ÷ 9","Total letters ÷ 10","Chunked − non-chunked","Total letters × 2"],1,"Total recalled in a series ÷ 10 strings."],
["Chess experts lost their memory advantage when…",["Time was shorter","Pieces were placed randomly","Boards were bigger","They were tired"],1,"Chase & Simon 1973: no meaningful chunks on random boards."],

let qs=[],qi=0,right=0;
function startQuiz(){qs=shuffle(QUIZ).slice(0,15).map(q=>({q:q[0],o:shuffle(q[1].map((t,k)=>({t,ok:k===q[2]}))),why:q[3]}));qi=0;right=0;drawQ()}
function drawQ(){
 if(qi>=qs.length){const pct=Math.round(right/qs.length*100),best=Math.max(pct,store.get("pl-best",0));store.set("pl-best",best);
  $("#quiz").innerHTML=`<div class="eyebrow">Result</div><div class="score">${right}/${qs.length}</div><p>${pct>=80?"Viva ready.":pct>=50?"Getting there. Re-read the units you missed.":"Go through the units first, then retry."} Best: ${best}%.</p><button class="btn primary" id="qa">New quiz</button>`;$("#qa").onclick=startQuiz;return}
 const q=qs[qi];let answered=false;
 $("#quiz").innerHTML=`<div class="eyebrow">Viva question ${qi+1} of ${qs.length} · score ${right}</div><div class="bar" style="margin:10px 0"><i style="width:${qi/qs.length*100}%"></i></div><h2 style="font-size:1.5rem">${q.q}</h2><div class="opts">${q.o.map((o,k)=>`<button data-k="${k}">${o.t}</button>`).join("")}</div><p class="hint" id="why"></p><div class="row" id="nx"></div>`;
 $("#quiz .opts").onclick=e=>{const b=e.target.closest("button");if(!b||answered)return;answered=true;const p=q.o[+b.dataset.k];
  [...$("#quiz .opts").children].forEach((x,k)=>{if(q.o[k].ok)x.classList.add("right");x.disabled=true});if(p.ok)right++;else b.classList.add("wrong");
  $("#why").textContent=(p.ok?"Correct. ":"Not quite. ")+q.why;$("#nx").innerHTML=`<button class="btn primary" id="nq">${qi+1<qs.length?"Next":"See result"}</button>`;$("#nq").onclick=()=>{qi++;drawQ()};$("#nq").focus()};
}

let rapFilter="all";
function rapport(){
 setAcc(["var(--per)","var(--per-soft)"]);
 const list=EXPS.filter(e=>rapFilter==="all"||e.id===rapFilter);
 $("#rapport").innerHTML=`<div class="rapport-head"><div><div class="eyebrow">Before every practical</div><h2>Rapport question bank</h2><p class="reading">${EXPS.reduce((n,e)=>n+e.rapport.length,0)} imaginary and situational questions, 8–9 per experiment, each tied to the trait, factor or process that experiment measures.</p></div>
 <div class="row"><select id="rsel" aria-label="Experiment"><option value="all">All experiments</option>${EXPS.map(e=>`<option value="${e.id}" ${rapFilter===e.id?"selected":""}>Exp ${e.n} · ${e.name}</option>`).join("")}</select><button class="btn primary" id="spin">Random question</button></div></div>
 <div class="rcard" id="pick" hidden></div>
 ${list.map(e=>`<section class="sec"><div class="eyebrow">Experiment ${e.n}</div><h3>${e.name}</h3>${rapportList(e)}</section>`).join("")}`;
 $("#rsel").onchange=ev=>{rapFilter=ev.target.value;rapport()};
 $("#spin").onclick=()=>{const pool=list.flatMap(e=>e.rapport.map(r=>[e,r])),[e,r]=pool[Math.random()*pool.length|0];const p=$("#pick");p.hidden=false;p.classList.add("on");p.innerHTML=`<span class="chip" style="align-self:start">Exp ${e.n} · ${r[0]}</span><p class="say">${r[1]}</p><p class="hint">Links to: ${r[2]}</p>`};
}

function mode(m){
 document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.mode===m));
 const study=m==="intro"||m==="exp";
 $("#study").hidden=!study;["cards","quiz","rapport"].forEach(id=>$("#"+id).hidden=id!==m);

 scrollTo(0,0);
}
