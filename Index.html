<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>PsyLab Practicals</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: sticky top bar with mode tabs; Units = unit rail + reading column with an animated "plate" on top; other modes centred column */
:root{
  --bg:#f2f3f7; --surface:#ffffff; --ink:#151a2c; --muted:#5b6278; --line:#d9dce6; --grid:#e6e8ef;
  --cog:#2b50e0; --cog-soft:#e3e9ff; --per:#d4462f; --per-soft:#fde6e1; --hl:#ffe66b; --good:#23885a; --bad:#c43d2c;
  --display:"Bricolage Grotesque",system-ui,sans-serif; --body:"Atkinson Hyperlegible",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  --accent:var(--cog); --accent-soft:var(--cog-soft);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1120; --surface:#171b2e; --ink:#e7e9f3; --muted:#9aa1b9; --line:#2a3049; --grid:#161a2c;
  --cog:#88a0ff; --cog-soft:#1f2850; --per:#ff8a73; --per-soft:#3a2026; --hl:#6b5a12; --good:#5fd39a; --bad:#ff8a7a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1120; --surface:#171b2e; --ink:#e7e9f3; --muted:#9aa1b9; --line:#2a3049; --grid:#161a2c;
  --cog:#88a0ff; --cog-soft:#1f2850; --per:#ff8a73; --per-soft:#3a2026; --hl:#6b5a12; --good:#5fd39a; --bad:#ff8a7a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
@media (max-width:520px){dl.terms{grid-template-columns:1fr;gap:2px}dl.terms dd{margin-bottom:8px}}
body{background:var(--bg) linear-gradient(var(--grid) 1px,transparent 1px) 0 0/100% 28px;color:var(--ink);font:16px/1.6 var(--body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px;padding-block:10px}
.logo{font:700 1.3rem var(--display);letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.logo svg{width:26px;height:26px}
nav{display:flex;gap:4px;flex-wrap:wrap}
.btn,nav button{font:700 .9rem var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 14px;border-radius:8px;cursor:pointer}
nav button[aria-selected="true"],.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.prog{margin-left:auto;font:500 .78rem var(--mono);color:var(--muted)}
main{padding-block:26px 70px}
.eyebrow{font:500 .74rem var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
h2{font:700 clamp(1.7rem,4.5vw,2.5rem)/1.1 var(--display);letter-spacing:-.02em;margin:.15em 0 .3em;text-wrap:balance}
h3{font:700 1.15rem var(--display);margin:1.6em 0 .5em}
h4{font:700 .95rem var(--body);margin:1.1em 0 .3em}
mark{background:linear-gradient(transparent 55%,var(--hl) 55%);color:inherit;padding:0 2px}
p{margin:.4em 0 .8em}

.units{display:grid;grid-template-columns:240px minmax(0,1fr);gap:32px}
.rail{display:flex;flex-direction:column;gap:2px;position:sticky;top:76px;align-self:start;max-height:calc(100vh - 90px);overflow:auto}
.rail .grp{font:500 .7rem var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 10px 4px}
.rail button{all:unset;cursor:pointer;padding:7px 10px;border-radius:8px;display:grid;grid-template-columns:26px 1fr auto;gap:6px;font-size:.93rem;align-items:baseline}
.rail button .n{font:500 .72rem var(--mono);color:var(--muted)}
.rail button:hover{background:var(--surface)}
.rail button[aria-current="true"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--c);font-weight:700}
.rail button:focus-visible{outline:3px solid var(--cog)}
.rail .tick{color:var(--good)}
article{min-width:0}
.plate{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:10px 0 20px}
.plate svg{display:block;width:100%;height:auto;max-height:300px}
.plate .cap{font-size:.85rem;color:var(--muted);padding:8px 14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.reading{max-width:70ch}
ul.pts{padding-left:1.15em;display:grid;gap:5px;margin:.3em 0}
dl.terms{display:grid;grid-template-columns:minmax(130px,max-content) 1fr;gap:6px 18px;margin:.4em 0}
dl.terms dt{font-weight:700;color:var(--accent)}
dl.terms dd{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:.4em 0}
.chip{font:500 .78rem var(--mono);background:var(--accent-soft);color:var(--accent);padding:3px 9px;border-radius:99px}
.exp{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 20px 16px;margin:24px 0}
.exp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 24px}
.exp h4{font:500 .72rem var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.exp ol{padding-left:1.2em;margin:.2em 0;display:grid;gap:4px}
.formula{font:500 .92rem var(--mono);background:var(--accent-soft);color:var(--ink);padding:8px 12px;border-radius:8px;display:inline-block;margin:4px 0}
.lab{border:2px dashed var(--accent);border-radius:14px;padding:6px 20px 18px;margin:24px 0;background:color-mix(in srgb,var(--accent-soft) 40%,var(--surface))}
.lab .stage{min-height:120px;display:grid;place-items:center;text-align:center;font:700 clamp(1.6rem,6vw,2.6rem) var(--display);letter-spacing:.08em;background:var(--surface);border-radius:10px;border:1px solid var(--line);margin:10px 0;padding:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
textarea{width:100%;min-height:90px}
.cuegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;width:100%}
.cuegrid label{display:grid;gap:3px;font:500 .75rem var(--mono);color:var(--accent);text-align:left}
.out{font-size:.95rem;margin-top:8px}
.out b{color:var(--accent)}
.verdict{display:inline-block;font:700 .9rem var(--body);padding:4px 12px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.tip{border-left:4px solid var(--hl);background:var(--surface);padding:10px 14px;border-radius:0 10px 10px 0;margin:20px 0;font-size:.95rem}
.done-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:.5em 0}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 12px;border-bottom:1px solid var(--line)}
th{font:500 .7rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
tr:last-child td{border-bottom:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:6px 12px;font:700 .85rem var(--body)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.seg button:focus-visible{outline:3px solid var(--hl)}

/* svg art */
.art text{font-family:var(--body);fill:var(--ink)}
.art .mono{font-family:var(--mono)}
.art .box{fill:var(--surface);stroke:var(--line);stroke-width:2}
.art .acc{fill:var(--accent)} .art .accs{stroke:var(--accent)}
.art .soft{fill:var(--accent-soft)}
.art .mut{fill:var(--muted)}
.art .ln{stroke:var(--line);stroke-width:2;fill:none}
.flow{animation:flow 3.2s linear infinite}
@keyframes flow{0%{transform:translateX(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateX(var(--d,500px));opacity:0}}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.18);opacity:1}}
.draw{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 3.5s ease forwards infinite}
@keyframes draw{0%{stroke-dashoffset:900}60%,100%{stroke-dashoffset:0}}
.bob{animation:bob 4s ease-in-out infinite;transform-box:fill-box}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
/* attention filter states */
.att .un{animation:unB 3.2s linear infinite}
@keyframes unB{0%{transform:translateX(0);opacity:0}8%{opacity:1}40%{transform:translateX(230px);opacity:1}46%{transform:translateX(240px);opacity:0}100%{opacity:0;transform:translateX(240px)}}
.att.treisman .un{animation:unT 3.2s linear infinite}
@keyframes unT{0%{transform:translateX(0);opacity:0}8%{opacity:1}40%{transform:translateX(230px);opacity:1}46%{opacity:.25}92%{opacity:.25}100%{transform:translateX(520px);opacity:0}}
.att.treisman .name,.att.late .un{animation:flow 3.2s linear infinite;--d:520px}
.att .filt{transition:transform .4s}
.att.late .filt{transform:translateX(250px)}

/* cards & quiz */
.center{max-width:660px;margin:0 auto}
.card{perspective:1200px;height:300px;cursor:pointer;margin:16px 0}
.card-in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.card.flip .card-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px;display:flex;flex-direction:column;justify-content:center;gap:10px;overflow:auto}
.face.back{transform:rotateY(180deg);border-color:var(--ink)}
.face .q{font:700 1.4rem/1.3 var(--display);text-wrap:balance}
.hint{font-size:.85rem;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);transition:width .3s}
.opts{display:grid;gap:8px;margin:14px 0}
.opts button{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.opts button:hover:not(:disabled){border-color:var(--ink)}
.opts button:focus-visible{outline:3px solid var(--cog)}
.opts button.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 15%,var(--surface))}
.opts button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--surface))}
.score{font:700 3.4rem var(--display);font-variant-numeric:tabular-nums}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;margin-top:16px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px;transition:transform .25s,box-shadow .25s}
.rcard.on{box-shadow:0 0 0 3px var(--hl);transform:translateY(-3px)}
.rcard h3{margin:0;font-size:1.2rem}
.rcard .say{font:700 1.02rem/1.45 var(--body)}
.rcard .lbl{font:500 .68rem var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.rcard p{margin:0;font-size:.93rem}
.rapport-head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}

@media (max-width:780px){
  .units{grid-template-columns:1fr;gap:12px}
  .rail{position:static;flex-direction:row;overflow-x:auto;max-height:none;padding-bottom:6px}
  .rail .grp{display:none}
  .rail button{white-space:nowrap;border:1px solid var(--line);grid-template-columns:auto auto auto;background:var(--surface)}
  .prog{margin-left:0;width:100%}
  .card{height:340px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header><div class="wrap">
  <div class="logo"><svg viewBox="0 0 26 26" aria-hidden="true"><circle cx="9" cy="13" r="7" fill="var(--cog)"/><circle cx="17" cy="13" r="7" fill="var(--per)" opacity=".85"/></svg>PsyLab</div>
  <nav role="tablist" aria-label="Study modes">
    <button role="tab" data-mode="units" aria-selected="true">Units</button>
    <button role="tab" data-mode="cards">Flashcards</button>
    <button role="tab" data-mode="quiz">Viva quiz</button>
    <button role="tab" data-mode="rapport">Rapport</button>
  </nav>
  <div class="prog" id="prog"></div>
</div></header>

<main class="wrap">
  <section id="units" class="units"><div class="rail" id="rail"></div><article id="unit"></article></section>
  <section id="cards" class="center" hidden></section>
  <section id="quiz" class="center" hidden></section>
  <section id="rapport" hidden></section>
</main>

<script>
/* ---------- Animated plates (SVG) ---------- */
const ART = {
cognition:()=>`<svg class="art att" id="attsvg" viewBox="0 0 640 260" role="img" aria-label="Attention filter models animation">
 <text x="20" y="34" class="mono mut" font-size="12">LEFT EAR · attended</text><text x="20" y="184" class="mono mut" font-size="12">RIGHT EAR · unattended</text>
 <rect x="150" y="70" width="120" height="120" rx="12" class="box"/><text x="210" y="125" text-anchor="middle" font-size="14" font-weight="700">Sensory</text><text x="210" y="143" text-anchor="middle" font-size="14" font-weight="700">buffer</text>
 <g class="filt"><rect x="300" y="60" width="16" height="140" rx="6" class="acc"/><text x="308" y="226" text-anchor="middle" class="mono" font-size="12" fill="var(--accent)">FILTER</text></g>
 <rect x="350" y="70" width="130" height="120" rx="12" class="box"/><text x="415" y="125" text-anchor="middle" font-size="14" font-weight="700">Meaning</text><text x="415" y="143" text-anchor="middle" font-size="14" font-weight="700">analysis</text>
 <rect x="510" y="95" width="110" height="70" rx="12" class="soft"/><text x="565" y="135" text-anchor="middle" font-size="14" font-weight="700">Response</text>
 <circle class="flow" style="--d:520px" cx="40" cy="60" r="9" fill="var(--cog)"/><circle class="flow" style="--d:520px;animation-delay:1.1s" cx="40" cy="60" r="9" fill="var(--cog)"/><circle class="flow" style="--d:520px;animation-delay:2.2s" cx="40" cy="60" r="9" fill="var(--cog)"/>
 <circle class="un" cx="40" cy="205" r="9" fill="var(--per)"/><circle class="un" style="animation-delay:1.6s" cx="40" cy="205" r="9" fill="var(--per)"/>
 <g class="un name" style="animation-delay:.8s"><rect x="22" y="194" width="58" height="22" rx="11" fill="var(--per)"/><text x="51" y="210" text-anchor="middle" font-size="11" font-weight="700" fill="var(--surface)">your name</text></g>
</svg>`,
memory:()=>`<svg class="art" viewBox="0 0 640 260" role="img" aria-label="Atkinson-Shiffrin model with information flowing and a serial position curve">
 <rect x="20" y="40" width="150" height="80" rx="12" class="box"/><text x="95" y="76" text-anchor="middle" font-weight="700" font-size="15">Sensory</text><text x="95" y="96" text-anchor="middle" class="mono mut" font-size="11">≤ 2 s · huge</text>
 <rect x="245" y="40" width="150" height="80" rx="12" class="box"/><text x="320" y="76" text-anchor="middle" font-weight="700" font-size="15">STM</text><text x="320" y="96" text-anchor="middle" class="mono mut" font-size="11">20–30 s · 7±2</text>
 <rect x="470" y="40" width="150" height="80" rx="12" class="soft"/><text x="545" y="76" text-anchor="middle" font-weight="700" font-size="15">LTM</text><text x="545" y="96" text-anchor="middle" class="mono mut" font-size="11">years · unlimited</text>
 <path d="M320 40 C 280 0, 360 0, 320 40" class="ln" stroke="var(--accent)"/><text x="320" y="16" text-anchor="middle" class="mono" font-size="11" fill="var(--accent)">rehearsal</text>
 <circle class="flow" style="--d:460px" cx="95" cy="140" r="7" fill="var(--accent)"/><circle class="flow" style="--d:460px;animation-delay:1.6s" cx="95" cy="140" r="7" fill="var(--accent)"/>
 <circle class="flow" style="--d:180px;animation-delay:.8s" cx="95" cy="140" r="7" fill="var(--muted)"/>
 <text x="20" y="168" class="mono mut" font-size="11">attention → encoding → storage → retrieval</text>
 <line x1="330" y1="245" x2="620" y2="245" class="ln"/><line x1="330" y1="175" x2="330" y2="245" class="ln"/>
 <path class="draw" d="M335 185 C 380 230, 420 238, 480 238 S 580 236, 615 182" fill="none" stroke="var(--per)" stroke-width="4" stroke-linecap="round"/>
 <text x="340" y="178" class="mono" font-size="11" fill="var(--per)">primacy</text><text x="560" y="178" class="mono" font-size="11" fill="var(--per)">recency</text>
</svg>`,
cueing:()=>{const n=[[320,130,"FRUIT"],[180,60,"apple"],[460,60,"mango"],[150,200,"grape"],[490,200,"banana"],[320,235,"orange"],[60,130,"red"],[580,130,"yellow"]];
 return `<svg class="art" viewBox="0 0 640 260" role="img" aria-label="Spreading activation from a category cue">
 ${n.slice(1).map(([x,y])=>`<line x1="320" y1="130" x2="${x}" y2="${y}" class="ln"/>`).join("")}
 ${n.map(([x,y,t],i)=>`<g><circle class="pulse" style="animation-delay:${i?0.25*i:0}s" cx="${x}" cy="${y}" r="${i?28:40}" fill="${i?'var(--accent-soft)':'var(--accent)'}"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="${i?13:15}" font-weight="700" ${i?'':'fill="var(--surface)"'}>${t}</text></g>`).join("")}
 <text x="16" y="250" class="mono mut" font-size="11">cue lights up → activation spreads → target recalled</text></svg>`},
chunking:()=>{const L="BGHIEKMON".split("");return `<svg class="art" viewBox="0 0 640 220" role="img" aria-label="Nine letters regroup into three chunks">
 <style>@keyframes ch{0%,25%{transform:translateX(0)}50%,85%{transform:translateX(var(--x))}100%{transform:translateX(0)}}.lt{animation:ch 5s ease-in-out infinite}</style>
 ${L.map((c,i)=>{const g=Math.floor(i/3),x=60+i*58,shift=(g-1)*36;return `<g class="lt" style="--x:${shift}px"><rect x="${x-22}" y="70" width="44" height="56" rx="8" class="${g===1?'soft':'box'}"/><text x="${x}" y="108" text-anchor="middle" font-size="26" font-weight="700" class="mono">${c}</text></g>`}).join("")}
 <text x="320" y="170" text-anchor="middle" font-size="15">9 separate items → <tspan font-weight="700" fill="var(--accent)">3 chunks</tspan> (BGH · IEK · MON)</text>
 <text x="320" y="196" text-anchor="middle" class="mono mut" font-size="11">STM holds 7 ± 2 chunks, not 7 ± 2 bits</text></svg>`},
miq:()=>{const m=[["Visual","see"],["Auditory","hear"],["Gustatory","taste"],["Olfactory","smell"],["Tactual","touch"],["Organic","body"]];
 return `<svg class="art" viewBox="0 0 640 240" role="img" aria-label="Six imagery modalities around a mind">
 <circle cx="320" cy="120" r="46" class="acc"/><text x="320" y="117" text-anchor="middle" fill="var(--surface)" font-weight="700" font-size="14">mental</text><text x="320" y="134" text-anchor="middle" fill="var(--surface)" font-weight="700" font-size="14">image</text>
 ${m.map(([a,b],i)=>{const t=i/6*Math.PI*2-Math.PI/2,x=320+Math.cos(t)*200,y=120+Math.sin(t)*92;return `<line x1="320" y1="120" x2="${x}" y2="${y}" class="ln"/><g class="pulse" style="animation-delay:${i*.4}s"><circle cx="${x}" cy="${y}" r="30" class="soft"/></g><text x="${x}" y="${y-2}" text-anchor="middle" font-size="12" font-weight="700">${a}</text><text x="${x}" y="${y+13}" text-anchor="middle" class="mono mut" font-size="10">${b}</text>`}).join("")}
 </svg>`},
solat:()=>`<svg class="art" viewBox="0 0 640 250" role="img" aria-label="Left and right hemispheres with corpus callosum">
 <path d="M318 30 C 200 20, 120 70, 130 140 C 140 210, 230 230, 318 220 Z" fill="var(--cog-soft)" stroke="var(--cog)" stroke-width="3"/>
 <path d="M322 30 C 440 20, 520 70, 510 140 C 500 210, 410 230, 322 220 Z" fill="var(--per-soft)" stroke="var(--per)" stroke-width="3"/>
 <rect x="296" y="112" width="48" height="16" rx="8" class="acc"/><circle class="flow" style="--d:40px" cx="300" cy="120" r="5" fill="var(--surface)"/>
 <text x="220" y="90" text-anchor="middle" font-weight="700" fill="var(--cog)">LEFT (L)</text>

const U=[
{id:"cognition",grp:"Cognition",n:"01",name:"Introduction to Cognition",art:"cognition",cap:"Tap a model to see what the filter lets through.",
 body:`<p>Cognitive psychology is the <mark>scientific study of mental processes</mark>: perception, attention, memory, language, problem-solving and thinking. It treats the mind as an <b>information-processing system</b>, like a computer, and studies it with reaction times, neuroimaging and psychophysiological measures.</p>
 <p>Applied in clinical work (CBT restructures maladaptive thoughts) and education (memory consolidation, cognitive load, attention span).</p>
 <h3>Perception</h3><p>Organising and interpreting sensory input. <b>Sensation</b> is just detecting stimuli; <b>perception</b> combines bottom-up data with top-down context.</p>
 <dl class="terms"><dt>Gestalt</dt><dd>Wertheimer, Koffka, Köhler. Mind groups elements into wholes: <b>proximity, similarity, closure, continuity</b>.</dd>
 <dt>Gibson (direct)</dt><dd>Bottom-up. Optical arrays carry enough info. <mark>Affordances</mark>: a chair affords sitting.</dd>
 <dt>Gregory (indirect)</dt><dd>Top-down. Perception = hypothesis testing from past experience.</dd></dl>
 <div class="chips"><span class="chip">visual</span><span class="chip">auditory</span><span class="chip">haptic</span><span class="chip">olfactory + gustatory</span></div>
 <h3>Attention</h3><p>Selective concentration. Capacity is limited, so attention is a <b>bottleneck</b>.</p>
 <dl class="terms"><dt>Selective</dt><dd>One stream, ignore the rest. Cocktail party effect.</dd><dt>Divided</dt><dd>Several tasks at once (driving + directions).</dd><dt>Sustained</dt><dd>Vigilance over time (radar screens).</dd><dt>Alternating</dt><dd>Switching between tasks.</dd></dl>
 <dl class="terms"><dt>Broadbent</dt><dd><b>Early selection</b> filter blocks unattended info by physical features (pitch, loudness) before meaning.</dd>
 <dt>Treisman</dt><dd><b>Attenuation</b>: unattended info is turned down, not blocked. Your own name breaks through (low threshold).</dd>
 <dt>Deutsch-Norman</dt><dd><b>Late selection</b>: everything analysed for meaning; bottleneck just before response.</dd>
 <dt>Kahneman</dt><dd><b>Capacity model</b>: a flexible pool of resources, shared by demand, arousal and intention.</dd></dl>
 <h3>Thinking & problem solving</h3>
 <dl class="terms"><dt>Algorithm</dt><dd>Step-by-step, guarantees the answer (long division).</dd><dt>Heuristic</dt><dd>Rule of thumb, fast, not guaranteed (working backward, means-ends).</dd><dt>Insight</dt><dd>Sudden "aha". Köhler's chimps.</dd></dl>
 <p>Barriers: <b>functional fixedness</b>, <b>mental set</b>, <b>confirmation bias</b>.</p>
 <h3>Learning & current trends</h3><p>Learning = relatively permanent change in mental structures from experience. Tolman's latent learning and cognitive maps, Piaget's constructivism, Bandura's observational learning.</p>
 <p>HCI / UX: icons use Gestalt and metaphors to cut <mark>cognitive load</mark>; buttons signal affordances; <b>Hick's law</b> says decision time rises logarithmically with number of choices; design guides selective attention.</p>`,
 tip:"Filter models in order of where selection happens: <b>Broadbent (early) → Treisman (attenuated) → Deutsch-Norman (late)</b>. Kahneman is the odd one: no filter, a resource pool."},
{id:"memory",grp:"Cognition",n:"02",name:"Introduction to Memory",art:"memory",cap:"Grey dot = attended but not rehearsed, so it's lost from STM.",
 body:`<p>Memory = information is <mark>encoded, retained, organised and retrieved</mark>. It's active, not passive storage, and remembering is partly reconstruction.</p>
 <h3>Who said what</h3><dl class="terms"><dt>Ebbinghaus</dt><dd>First experimental study. Nonsense syllables, retention changes over time, practice helps.</dd><dt>William James</dt><dd>Primary memory (in consciousness now) vs secondary (can be brought back).</dd><dt>Bartlett</dt><dd>Memory is <b>reconstructive</b>, shaped by schemas.</dd><dt>Atkinson & Shiffrin (1968)</dt><dd>Three-store <b>modal model</b> + control processes.</dd><dt>Baddeley & Hitch (1974)</dt><dd>Working memory as an active workspace.</dd><dt>Tulving</dt><dd>Episodic vs semantic memory.</dd></dl>
 <h3>Memory systems</h3>
 <div class="tbl"><table><thead><tr><th>Store</th><th>Duration</th><th>Capacity</th><th>Key fact</th></tr></thead><tbody>
 <tr><td>Sensory</td><td>≤ ~2 s</td><td>Very large</td><td>Iconic (visual, sparkler trail, Sperling's partial report) · Echoic (auditory)</td></tr>
 <tr><td>Short-term</td><td>20–30 s</td><td>7 ± 2 chunks (Miller, 1956)</td><td>Brown–Peterson shows fast loss without rehearsal</td></tr>
 <tr><td>Long-term</td><td>Minutes → years</td><td>Huge</td><td>Multiple systems, not one store</td></tr></tbody></table></div>
 <h4>Long-term memory types</h4><ul class="pts"><li><b>Explicit / declarative:</b> <mark>episodic</mark> (your first day at college) and <mark>semantic</mark> (Delhi is India's capital).</li><li><b>Implicit / nondeclarative:</b> procedural (riding a bike), priming, classical conditioning, habituation, sensitization.</li></ul>
 <h3>Working memory model</h3><dl class="terms"><dt>Central executive</dt><dd>Boss: directs attention, allocates resources, switches tasks, plans.</dd><dt>Phonological loop</dt><dd>Phonological store + subvocal rehearsal (repeating a phone number).</dd><dt>Visuospatial sketchpad</dt><dd>Images and routes (classroom → library).</dd><dt>Episodic buffer</dt><dd>Added later (2000). Binds loop, sketchpad and LTM together.</dd></dl>
 <h3>Levels of processing (Craik & Lockhart, 1972)</h3><p>Depth matters more than store: <b>structural</b> (capital letters?) → <b>phonemic</b> (rhymes with CAT?) → <b>semantic</b> (can you eat it?). Semantic = deepest = best retention.</p>
 <h3>Serial position effect</h3><p>U-shaped recall curve. <mark>Primacy</mark>: early items rehearsed into LTM. <mark>Recency</mark>: last items still in STM. Middle items lost.</p>
 <h3>Processes</h3><p class="formula">attention → encoding → consolidation → storage → retrieval → reconstruction</p>
 <ul class="pts"><li><b>Maintenance rehearsal</b>: plain repetition. <b>Elaborative rehearsal</b>: link to meaning.</li><li>Retrieval: <b>recall</b> (produce it) vs <b>recognition</b> (pick it; more cues, easier).</li><li>Forgetting: <b>decay</b> and <b>interference</b>. Often it's still there, just no cue.</li></ul>`,
 tip:"Three-store = <b>Atkinson & Shiffrin 1968</b>. Working memory = <b>Baddeley & Hitch 1974</b> (+ episodic buffer 2000). Levels of processing = <b>Craik & Lockhart 1972</b>. Examiners love these years."},
{id:"cueing",grp:"Cognition",n:"03",name:"Cueing on Recall",art:"cueing",cap:"Spreading activation (Collins & Loftus, 1975).",lab:"cueLab",
 body:`<p><b>Recall</b> = actively reproducing info with no copy in front of you. Harder than <b>recognition</b> (picking from options). Types: <mark>free recall</mark> (any order), <mark>serial recall</mark> (exact order), <mark>cued recall</mark> (with a hint).</p>
 <p>A <b>cue</b> is any stimulus linked to the memory: a word, category, picture, sound, smell or place. Memories sit in networks, so a cue unlocks a path.</p>
 <h3>How the method developed</h3><dl class="terms"><dt>Ebbinghaus (1885)</dt><dd>Controlled word lists, basis for all recall research.</dd><dt>Associationists</dt><dd>Ideas are linked, one triggers another.</dd><dt>Mary Whiton Calkins</dt><dd><b>Paired-associate learning</b> (dog–chair). Early cued recall.</dd><dt>Tulving & Pearlstone (1966)</dt><dd>Category names as cues boosted recall vs free recall. Cues help <b>retrieval</b>, not just storage.</dd><dt>Tulving & Thomson (1973)</dt><dd><b>Encoding specificity principle</b>.</dd><dt>Godden & Baddeley (1975)</dt><dd>Divers recalled better in the same place they learned (underwater/land). Context is a cue.</dd></dl>
 <h3>Theories</h3><dl class="terms"><dt>Encoding specificity</dt><dd>A cue works only if it matches how info was encoded.</dd><dt>Spreading activation</dt><dd>Collins & Loftus 1975. Activating one node spreads to linked ones.</dd><dt>Generate–recognise</dt><dd>Cue generates candidates, then you recognise the right one.</dd><dt>Context-dependent</dt><dd>Same internal state / place at learning and recall helps.</dd><dt>Levels of processing</dt><dd>Deeper encoding, stronger trace.</dd></dl>
 <p><b>Applications:</b> exam mnemonics and keywords, the cognitive interview for eyewitnesses, memory rehab, jingles and logos in ads, grocery lists by category.</p>`,
 exp:{no:1,aim:"To study the effect of cueing on recall.",hyp:"Cueing has a positive effect on recall.",iv:"Presence of cues in the second series",dv:"Number of words recalled in each list",
  mat:["Two lists of 30 words each","List A: random words","List B: 5 categories × 6 words","Plain response sheet (List A)","Response sheet with the 5 category names (List B)","Wooden screen","Stopwatch"],
  ctrl:["Subject not told the nature of the experiment","Silent, well-lit room","Exposure: 2 seconds per word","Serial order of presentation","5-minute rest after List A"],
  proc:["Build rapport.","Series 1 (free recall): read List A aloud in an even tone, 2 s per word.","Give the plain sheet. Allow 3 minutes to recall (don't mention the time limit).","Rest 5 minutes.","Series 2 (cued recall): read List B the same way.","Give the sheet with the 5 category names. Allow 3 minutes."],
  analysis:"Difference = Score in Series 2 − Score in Series 1",res:"Record result: List A = 8, List B = 14, difference = 6 → cues had a positive effect on recall."},
 tip:"Viva favourite: <b>why are categories a cue?</b> Because List B was encoded by category (encoding specificity), so the category label at test matches the encoding."},
{id:"chunking",grp:"Cognition",n:"04",name:"Chunking",art:"chunking",cap:"Same letters, fewer units to hold.",lab:"chunkLab",
 body:`<p><b>Chunking</b> = grouping small pieces into <mark>larger meaningful units</mark> so more fits in STM. B-G-H-I-E-K-M-O-N is 9 items; BGH-IEK-MON is 3. STM is limited by <b>number of units</b>, not total information. Chunking doesn't increase capacity, it uses it better.</p>
 <h3>Development</h3><dl class="terms"><dt>George Miller (1956)</dt><dd>"The Magical Number Seven, Plus or Minus Two". Named the <b>chunk</b> (vs a bit). Reviewed earlier digit-span work, didn't run the first experiments.</dd><dt>Bower et al. (1969)</dt><dd>Hierarchical category lists improved free recall.</dd><dt>Chase & Simon (1973)</dt><dd>Chess experts remembered real game positions far better, but <b>not random boards</b>.</dd></dl>
 <h3>Theories</h3><dl class="terms"><dt>Magic number</dt><dd>7 ± 2 chunks regardless of chunk size.</dd><dt>Working memory</dt><dd>Chunks help the limited phonological loop hold more.</dd><dt>LTM interaction</dt><dd>A chunk needs prior knowledge ("NASA" is one unit only if you know it).</dd><dt>Template theory</dt><dd>Gobet & Simon 1996. Experts build large flexible templates.</dd><dt>Capacity limitation</dt><dd>STM = a few slots for meaningful units.</dd></dl>
 <p><b>Applications:</b> phone and ID numbers, study notes, language phrases, UI steps, memory rehab and cognitive training.</p>`,
 exp:{no:2,aim:"To study the effect of chunking on recall.",hyp:"Chunking increases the efficiency of recall.",iv:"Presence or absence of chunks",dv:"Number of letters correctly recalled",
  mat:["Set A: 10 cards, 9 letters each in cvccvccvc order","Set B: 10 cards, 9 letters as three cvc trigrams with spaces","Stop clock"],
  ctrl:["Exposure: 2 seconds per card","5-minute rest between series"],
  proc:["Series 1 (no chunks): at the ready signal, expose a Set A card for 2 s.","Subject writes letters in the same order, up to 15 s. A forgotten letter = draw a line.","Repeat for all 10 cards. Rest 5 minutes.","Series 2 (chunks): same procedure with Set B."],
  analysis:"Average span = total letters recalled ÷ 10 · D = chunked − non-chunked",res:"Record result: non-chunked 55 → 5.5, chunked 80 → 8.0. Errors were within-chunk, none between chunks."},
 tip:"Know the error types: <b>within-chunk</b> (wrong letter inside a trigram) vs <b>between-chunk</b> (whole chunk misplaced)."},
{id:"miq",grp:"Cognition",n:"05",name:"Mental Imagery Questionnaire",art:"miq",cap:"Six sub-tests, 15 items each.",lab:"miqLab",
 body:`<p><b>Mental imagery</b> = experiencing an object or event <mark>without the actual stimulus</mark> (picturing your childhood home, hearing a song in your head). It shares features with perception and is involved in memory, thinking and emotion. People differ in vividness.</p>
 <h3>Six modalities</h3><div class="chips"><span class="chip">visual</span><span class="chip">auditory</span><span class="chip">tactile</span><span class="chip">olfactory</span><span class="chip">gustatory</span><span class="chip">kinaesthetic</span></div>
 <p>The MIQ sub-tests: <b>Visual, Auditory, Gustatory, Olfactory, Tactual, Organic (bodily)</b>.</p>
 <h3>Theories</h3><dl class="terms"><dt>Paivio</dt><dd><b>Dual coding</b>: verbal + imagery systems. "Apple" as word and picture = two routes to recall.</dd><dt>Kosslyn</dt><dd><b>Depictive</b>: images hold spatial info; you can scan and rotate them like perception.</dd><dt>Pylyshyn</dt><dd><b>Propositional</b>: no literal pictures; abstract descriptions. This vs Kosslyn = the <mark>imagery debate</mark>.</dd></dl>
 <p><b>Applications:</b> memory aids, sports mental rehearsal, clinical imagery techniques, planning and creativity.</p>`,
 exp:{no:3,aim:"To assess the sensory experience of an individual in six areas: visual, auditory, gustatory, olfactory, tactual and bodily.",hyp:"Mental imagery has a positive effect on recall.",iv:"—",dv:"Vividness ratings per sub-test",
  mat:["Mental Imagery Questionnaire","Writing materials","Manual and norms"],ctrl:["Comfortable, well-lit room","No visual or auditory distraction","No time limit"],
  proc:["Seat the subject, give the MIQ booklet.","Instruct: read each statement, form a mental picture, rate how vivid it is.","Don't omit items. Individual or group test.","Rate on the 6-point scale: 5 very clear & vivid · 4 fairly vivid · 3 just clear · 2 somewhat clear · 1 dim · 0 no image."],
  analysis:"Sub-test total (max 75) → overall total (6 sub-tests) → z-score → grade",res:"Record result: total 353, z = +2.21, grade A (extremely clear and vivid imagery)."},
 tip:"Why will nobody hit 75? Because no one rates all 15 items at 5, and no one rates them all 0. Real scores sit in between."},
{id:"solat",grp:"Cognition",n:"06",name:"SOLAT",art:"solat",cap:"Hemisphericity = preference, not proof of brain dominance.",lab:"solatLab",
 body:`<p><b>Hemisphericity</b> = preference for processing with one hemisphere or both together. Language is mostly <b>left</b>, visuospatial mostly <b>right</b>, but both work together via the <mark>corpus callosum</mark>.</p>
 <h3>Background</h3><dl class="terms"><dt>Split-brain studies</dt><dd>Sperry, Gazzaniga, Bogen showed hemispheres act differently when disconnected.</dd><dt>Torrance et al. (1977)</dt><dd>Developed <b>Your Style of Learning and Thinking</b> (SOLAT).</dd><dt>D. Venkataraman (1994)</dt><dd>Indian version, <b>50 items</b>. Scores: right, left, integrated (whole).</dd></dl>
 <div class="tbl"><table><thead><tr><th>Left (L)</th><th>Right (R)</th></tr></thead><tbody><tr><td>Verbal, analytical</td><td>Holistic, visual</td></tr><tr><td>Sequential, logical</td><td>Spatial, non-verbal, intuitive</td></tr></tbody></table></div>
 <p><b>Limitation:</b> "left-brained / right-brained" is an <mark>oversimplification</mark>. SOLAT measures reported preference, not brain activity.</p>`,
 exp:{no:4,aim:"To assess the dominance of the hemisphere in the styles of learning and thinking by administering the SOLAT tool.",hyp:"—",iv:"—",dv:"R, L and W scores",
  mat:["SOLAT tool","Manual","Norms for interpretation","Writing material"],ctrl:["Clear instructions","Help with difficult words","For 8th standard and above"],
  proc:["Each statement has two parts, A and B.","Tick whichever is true for you. Tick both if both are true, leave both if neither is.","Check marks are firm before scoring."],
  analysis:"(a) ticks = R · (b) ticks = L · both ticked = W (integrated) · raw → sten → high / average / low · dominance = highest of the three",res:"Record result: R = 28 (sten 7), L = 11 (sten 4), W = 9 (sten 5) → right hemisphericity."},
 tip:"Remember <b>a = Right, b = Left</b> (it's reversed from what you'd guess). Both = W, none = not counted."},
{id:"personality",grp:"Personality",n:"07",name:"Introduction to Personality",art:"personality",cap:"From the Latin persona, an actor's mask.",
 body:`<p>APA: <mark>"the enduring configuration of characteristics and behaviour that comprises an individual's unique adjustment to life"</mark>, shaped by heredity, maturation, training, identification, culture and experiences.</p>
 <p>Allport (1937): "the <b>dynamic organization</b> within the individual of those <b>psychophysical systems</b> that determine his unique adjustments to the environment."</p>
 <h3>Theorists in one line each</h3><dl class="terms">
 <dt>Rogers</dt><dd>Actualizing tendency, unconditional positive regard, conditions of worth → incongruence, fully functioning person.</dd>
 <dt>Maslow</dt><dd>Needs: physiological → safety → belonging → esteem → self-actualization.</dd>
 <dt>Jung</dt><dd>Personal & collective unconscious, archetypes (persona, shadow, anima/animus, Self), 4 functions, individuation.</dd>
 <dt>Adler</dt><dd>Inferiority complex, striving for superiority, fictional finalism, style of life, social interest, birth order.</dd>
 <dt>Allport</dt><dd>Cardinal / central / secondary traits, functional autonomy.</dd>
 <dt>Cattell</dt><dd>Factor analysis, surface vs source traits, L/Q/T data, 16PF.</dd>
 <dt>Eysenck</dt><dd>Biological. Extraversion, Neuroticism, then Psychoticism (PEN).</dd>
 <dt>Erikson</dt><dd>8 psychosocial stages across the lifespan.</dd></dl>
 <h3>Factors influencing personality</h3><dl class="terms">
 <dt>Genetic</dt><dd>PEN, Big Five (McCrae & Costa), Buss & Plomin temperaments, Zuckerman sensation seeking. Genes = predisposition.</dd>
 <dt>Environmental</dt><dd>Birth order, culture (Horney), life events.</dd>
 <dt>Learning</dt><dd>Skinner, Bandura (self-efficacy), Rotter (locus of control), Seligman (learned helplessness).</dd>
 <dt>Parental</dt><dd>Authoritative parenting → best outcomes.</dd>
 <dt>Developmental</dt><dd>Freud: fixed by 5–6. Big Five fairly stable after 30.</dd>
 <dt>Conscious / unconscious</dt><dd>Kelly's personal constructs; the modern "cognitive unconscious".</dd></dl>`,
 tip:"For deeper theorist notes, use the Personality study deck I made you last time. This unit is the quick version for the practical record."},
{id:"pf16",grp:"Personality",n:"08",name:"16 Personality Factors",art:"pf16",cap:"Sten 1–10, population mean 5.5.",lab:"stenLab",
 body:`<p>Developed by <b>Raymond Cattell</b> using <mark>factor analysis</mark> to find 16 primary <b>source traits</b>. Self-report, used in healthcare, jobs and counselling.</p>
 <div class="tbl"><table><thead><tr><th>Code</th><th>Factor</th><th>Code</th><th>Factor</th></tr></thead><tbody>
 <tr><td>A</td><td>Warmth</td><td>L</td><td>Vigilance</td></tr><tr><td>B</td><td>Reasoning</td><td>M</td><td>Abstractedness</td></tr><tr><td>C</td><td>Emotional stability</td><td>N</td><td>Privateness</td></tr><tr><td>E</td><td>Dominance</td><td>O</td><td>Apprehension</td></tr><tr><td>F</td><td>Liveliness</td><td>Q1</td><td>Openness to change</td></tr><tr><td>G</td><td>Rule-consciousness</td><td>Q2</td><td>Self-reliance</td></tr><tr><td>H</td><td>Social boldness</td><td>Q3</td><td>Perfectionism</td></tr><tr><td>I</td><td>Sensitivity</td><td>Q4</td><td>Tension</td></tr></tbody></table></div>
 <p>No D, J or K. Memory hook: <mark>"A Bright Cat Eats Fish, Gets Happy In Lazy Mornings, Naps Often"</mark> then Q1–Q4.</p>
 <h3>Second-order factors</h3><div class="chips"><span class="chip">Extraversion</span><span class="chip">Anxiety</span><span class="chip">Tough poise</span><span class="chip">Independence</span><span class="chip">Control</span><span class="chip">Adjustment</span><span class="chip">Leadership</span><span class="chip">Creativity</span></div>
 <p>The record computes the first four. <b>Applications:</b> career counselling, clinical assessment, personnel selection, leadership and team building, research, couples counselling.</p>`,

{id:"epq",grp:"Personality",n:"09",name:"Eysenck's Personality Questionnaire–Revised",art:"epq",cap:"E and N are independent axes. P was added later.",lab:"epqLab",
 body:`<p>Based on Eysenck's <b>biological trait theory</b>: a few broad, independent, continuous dimensions. The <mark>P-E-N model</mark> plus a <b>Lie (L)</b> scale for socially desirable answers.</p>
 <h3>How it evolved</h3><p class="formula">MPI (E, N) → EPI (E, N + Lie) → EPQ 1975 (+ P, adult & junior) → EPQ-R 1985</p>
 <p>EPQ-R (Eysenck, Eysenck & Barrett, 1985) fixed the weak <b>P scale</b> and added 12-item short scales. Full = <b>100 items</b>, short form = <b>48</b> (12 × 4).</p>
 <dl class="terms"><dt>Extraversion (E)</dt><dd>Sociable, lively, venturesome ↔ quiet, reserved.</dd><dt>Neuroticism (N)</dt><dd>Anxious, moody, guilty ↔ calm. A normal dimension, <b>not a disorder</b>.</dd><dt>Psychoticism (P)</dt><dd>Aggressive, impulsive, cold, nonconforming ↔ socialised, empathic. Doesn't mean psychotic.</dd><dt>Lie (L)</dt><dd>Faking good / social desirability.</dd></dl>
 <h3>Indian adaptations</h3><ul class="pts"><li><b>Laungani (1985)</b>: 558 men, 636 women, factor match &gt; .97 with English sample.</li><li><b>EPQRS-H</b> Hindi short form, Tiwari, Singh & Singh (2009): 202 BHU students. E, N, L reliable; P less so.</li></ul>
 <p><b>Limitations:</b> weak P scale, skewed scores, too broad compared to the Big Five.</p>`,
 exp:{no:6,aim:"To assess the personality of the participant using the Eysenck Personality Questionnaire.",hyp:"—",iv:"—",dv:"P, E, N and L scores",
  mat:["EPQ-R","Manual","Stencil","Writing materials"],ctrl:["Subject understands instructions","Mark only on the answer sheet, not the booklet","Don't open booklet until told"],
  proc:["Seat subject, build rapport.","Answer Yes or No with the first response that comes to mind.","No right or wrong or trick questions. Work quickly."],
  analysis:"Stencil scoring, 1 mark per item, page totals → raw → sten · sten 5–6 = average, 1–4 = gradual decrease, higher = greater strength",res:"Lie score of 7+ (men) or 8+ (women) → results rejected clinically."},
 tip:"Raw score cut-offs to learn: <b>E</b> ≥17 extravert, 8–16 ambivert, &lt;8 introvert · <b>N</b> ≥14 high, 5–13 average, ≤4 well balanced. Try them in the checker below."},
{id:"neo",grp:"Personality",n:"10",name:"NEO-FFI-3",art:"neo",cap:"Five broad domains, no facets.",lab:"neoLab",
 body:`<p>A <mark>60-item</mark> short form: five 12-item scales. Revised the NEO-FFI by replacing <b>15 items</b> for readability. Ages <b>12+</b>. <b>Form S</b> = self-report, <b>Form R</b> = observer rating.</p>
 <h3>Theory</h3><dl class="terms"><dt>Five-Factor Model</dt><dd>From the lexical tradition (Allport, Cattell), built out by <b>McCrae & Costa</b>.</dd><dt>Five-Factor Theory</dt><dd><b>Basic tendencies</b> (biological traits) vs <b>characteristic adaptations</b> (habits, attitudes).</dd><dt>Hierarchy</dt><dd>Domains on top, facets below. NEO-PI-3 measures facets; FFI-3 only domains.</dd><dt>Consensual validation</dt><dd>Compare Form S with Form R to check self-insight and bias.</dd></dl>
 <h3>The five domains (OCEAN)</h3><dl class="terms"><dt>Neuroticism</dt><dd>Distress, negative affect ↔ calm, resilient.</dd><dt>Extraversion</dt><dd>Outgoing, assertive, energetic ↔ reserved, independent.</dd><dt>Openness</dt><dd>Imaginative, curious, questions tradition ↔ conventional.</dd><dt>Agreeableness</dt><dd>Empathic, cooperative ↔ competitive, sceptical.</dd><dt>Conscientiousness</dt><dd>Organised, purposeful ↔ casual, easily distracted.</dd></dl>
 <p><b>Applications:</b> counselling and clinical planning, I/O psychology and job profiling, research in genetics, cross-cultural and health psychology.</p>`,
 exp:{no:7,aim:"To assess the personality of the subject by administering the NEO Five-Factor Inventory.",hyp:"—",iv:"—",dv:"Raw and T-scores on 5 domains",
  mat:["NEO-FFI booklet","Manual","Norms","Writing materials"],ctrl:["No items omitted","Full cooperation","Confidentiality assured"],
  proc:["Seat subject, build rapport.","60 statements, 5 options: strongly disagree → strongly agree.","Choose what best represents you. Answers kept confidential."],

{id:"bell",grp:"Personality",n:"11",name:"Bell's Adjustment Inventory",art:"bell",cap:"High score = poor adjustment in that area.",lab:"bellLab",
 body:`<p>APA: adjustment is <mark>"a change in attitude, behavior, or both"</mark> to fit the current or changing environment.</p>
 <h3>Adjustment disorders</h3><p>Emotional or behavioural reaction to a stressor, starting <b>within 3 months</b>. Affects <b>2–8%</b>, more in women and adolescents. DSM-5 types:</p>
 <ul class="pts"><li>With depressed mood</li><li>With anxiety</li><li>With mixed anxiety and depressed mood</li><li>With disturbance of conduct</li><li>With mixed disturbance of emotions and conduct</li><li>Unspecified</li></ul>
 <h3>The inventory (adult form)</h3><p>Five areas: <b>home, health, social, emotional, occupational</b>. <mark>High = unsatisfactory, low = satisfactory</mark>. Self-administering, about <b>25 minutes</b>, used in adult counselling.</p>
 <ul class="pts"><li><b>Reliability:</b> .81 to .94 (Spearman-Brown), employed people aged 23–28.</li><li><b>Validity:</b> item selection + separating extreme cases picked by counsellors.</li></ul>`,
 exp:{no:8,aim:"To assess the level of adjustment of the participant using Bell's Adjustment Inventory.",hyp:"—",iv:"—",dv:"Scores in 5 areas + total",
  mat:["Bell's Adjustment Inventory","Scoring key","Norms","Writing material"],ctrl:["Rapport for honest answers","Instructions understood","Identity kept confidential","Explain items only if the subject can't understand","No omissions; use ? only when undecided"],
  proc:["Read each question, circle Yes, No or ?.","No right or wrong answers, no time limit, work rapidly.","Not employed? Answer occupational items for the last job held."],
  analysis:"Answer matches key → 1 · doesn't match → 0 · ? not scored · total per area → compare with norms (men / women)",res:"Use the norms checker below to interpret any score."},
 tip:"Social adjustment uses different words: <b>low = aggressive</b>, <b>high = retiring</b>, not good/bad."},
{id:"viva",grp:"Viva prep",n:"12",name:"Viva essentials",art:"scores",cap:"Same person, four ways to say where they stand.",lab:"scoreLab",
 body:`<p>The stuff examiners ask about <b>every</b> practical: timing, score types, biology, MD and what each test is actually for.</p>
 <h3>Stopwatch & standardisation</h3><ul class="pts"><li>The stopwatch times <b>presentation, recall, response and rest</b> so every participant gets the same conditions.</li><li>Reset before starting, know which event starts and stops it, record the time immediately, no extra cues during a timed trial.</li><li><mark>Standardisation</mark> = same instructions, same procedure for everyone. It cuts examiner-caused variation.</li><li>Timed practicals: cueing (2 s/word, 3 min recall, 5 min rest), chunking (2 s/card, 15 s recall, 5 min rest, 10 cards), Bell's (~25 min). MIQ has no time limit.</li></ul>
 <h3>Observation</h3><p>Note cooperation, attention, confusion, interruptions, fatigue, odd response patterns. Write it <b>objectively</b>: "looked away several times during presentation", not "was careless". Observation supports scoring, it never replaces it.</p>
 <h3>Score conversions</h3><div class="tbl"><table><thead><tr><th>Score</th><th>Meaning</th><th>Formula / scale</th></tr></thead><tbody>
 <tr><td>Raw</td><td>Direct score before norms</td><td>Means nothing alone</td></tr>
 <tr><td>z</td><td>Distance from mean in SD units</td><td>z = (X − M) / SD</td></tr>
 <tr><td>T</td><td>Mean 50, SD 10</td><td>T = 50 + 10z</td></tr>
 <tr><td>Sten</td><td>Standard ten, mean 5.5, SD 2</td><td>1–2 very low · 3–4 low · 5–6 avg · 7–8 high · 9–10 very high</td></tr>
 <tr><td>Percentile</td><td>% of norm group at or below you</td><td>75th percentile ≠ 75% marks</td></tr></tbody></table></div>
 <h3>Biological basis (safe viva wording)</h3><dl class="terms"><dt>Extraversion</dt><dd>Eysenck: extraverts have <b>lower baseline cortical arousal</b>, so they seek stimulation.</dd><dt>Neuroticism</dt><dd>Linked to emotional / autonomic reactivity and stress sensitivity. Normal dimension, not a disorder.</dd><dt>Psychoticism</dt><dd>Biologically influenced cluster: impulsive, nonconforming, tough-minded. Doesn't mean psychosis.</dd><dt>Big Five / 16PF</dt><dd>Genetic influences, but expression is shaped by learning and culture. No single brain area per factor.</dd><dt>Memory & attention</dt><dd>Distributed networks (hippocampus / medial temporal lobe for memory). Imagery recruits perception systems.</dd></dl>
 <p class="formula">"The trait has biological and genetic correlates, but it emerges from multiple interacting systems and environmental influences."</p>
 <h3>16PF Motivational Distortion (MD)</h3><p>In Forms C/D, <mark>MD flags faking good</mark> or overly favourable self-presentation. Score the MD items with the Form C key, sum to a raw score, interpret with the form's manual. A high MD <b>doesn't automatically invalidate</b> the profile and isn't proof of lying.</p>
 <h3>Utility of each test</h3><div class="tbl"><table><thead><tr><th>Test</th><th>Purpose</th><th>Practical use</th></tr></thead><tbody>
 <tr><td>Cueing</td><td>Effect of cues on retrieval</td><td>Prompts in memory support, rehab</td></tr><tr><td>Chunking</td><td>Effect of grouping on recall</td><td>Breaking study material into units</td></tr><tr><td>MIQ</td><td>Vividness of imagery</td><td>Imagery rehearsal, relaxation, guided imagery</td></tr><tr><td>SOLAT</td><td>Learning-thinking preference</td><td>Study strategy counselling</td></tr><tr><td>16PF</td><td>16 factors</td><td>Counselling, career guidance, HR</td></tr><tr><td>EPQ-R</td><td>P, E, N + Lie</td><td>Sociability, reactivity, response style</td></tr><tr><td>NEO-FFI-3</td><td>Big Five</td><td>Coping and interpersonal patterns, treatment planning</td></tr><tr><td>Bell's</td><td>5 adjustment areas</td><td>Spotting areas to explore in counselling</td></tr></tbody></table></div>
 <h3>Quick-fire answers</h3><dl class="terms"><dt>Can a test diagnose alone?</dt><dd>No. Use it with interview, history, observation and context.</dd><dt>Trait vs state</dt><dd>Stable tendency vs temporary condition.</dd><dt>Is a high score always good?</dt><dd>No. Depends on construct, scale direction and norms.</dd><dt>Forgot a cut-off?</dt><dd>State the scoring principle, say the exact cut-off is in the manual. <b>Don't guess.</b></dd><dt>Why rapport?</dt><dd>Comfort, understanding of instructions, cooperation. It helps but doesn't guarantee honest answers.</dd></dl>`,
 tip:"If you blank on a number in the viva, the guide's line is gold: <b>\"The principle is X; the exact cut-off is in the test manual.\"</b> Examiners prefer that to a wrong guess."}
];

const $=s=>document.querySelector(s);
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const words=t=>t.toLowerCase().split(/[^a-z]+/).filter(Boolean);
const countHits=(typed,list)=>new Set(words(typed).filter(w=>list.includes(w))).size;
let runId=0;

const LABS={
scoreLab(el){
 el.innerHTML=`<p>Enter a raw score with the norm group's mean and SD. Try the guide's example: mean 50, SD 10, raw 70.</p>
 <div class="row"><label>Raw X <input type="number" id="zx" value="70" style="width:90px"></label><label>Mean <input type="number" id="zm" value="50" style="width:90px"></label><label>SD <input type="number" id="zs" value="10" min="0.1" step="0.1" style="width:90px"></label></div><div class="out" id="zo"></div>`;
 const cdf=z=>{const t=1/(1+.2316419*Math.abs(z)),d=.3989423*Math.exp(-z*z/2),p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p};
 const upd=()=>{const x=+$("#zx").value,m=+$("#zm").value,s=+$("#zs").value;if(!(s>0)){$("#zo").textContent="SD must be above 0.";return}
  const z=(x-m)/s,T=50+10*z,st=Math.min(10,Math.max(1,Math.round(5.5+2*z))),pc=Math.round(cdf(z)*100);
  $("#zo").innerHTML=`z = (${x} − ${m}) / ${s} = <b>${z>=0?"+":""}${z.toFixed(2)}</b> · T = 50 + 10z = <b>${T.toFixed(0)}</b> · sten ≈ <b>${st}</b> · percentile ≈ <b>${pc}</b><br><span class="hint">Approximate, assuming a normal distribution. Real tests use their own norm tables.</span>`};
 el.querySelectorAll("input").forEach(i=>i.oninput=upd);upd();
},
cueLab(el){
 const A=["window","river","pencil","garden","doctor","candle","bottle","engine","forest","mirror","ladder","button"];
 const CAT={Fruits:["mango","grape","banana"],Animals:["tiger","rabbit","horse"],Colours:["purple","yellow","orange"],Furniture:["table","sofa","shelf"]};
 const B=shuffle(Object.values(CAT).flat());
 let a=null;
 el.innerHTML=`<p>Mini version of Experiment 1. 12 words per list, shown for 1.5 s each. Series 1 is free recall, Series 2 gives you category cues.</p>
 <div class="stage" id="cs">Ready?</div><div id="cin"></div><div class="row"><button class="btn primary" id="cgo">Start Series 1</button></div><div class="out" id="cout"></div>`;
 const show=async(list)=>{const id=++runId;$("#cgo").disabled=true;$("#cin").innerHTML="";for(const w of list){if(id!==runId)return false;$("#cs").textContent=w;await wait(1500)}$("#cs").textContent="Recall now";return id===runId};
 $("#cgo").onclick=async()=>{
  if(a===null){ if(!await show(shuffle(A)))return;
   $("#cin").innerHTML=`<label for="cfree" class="hint">Type every word you remember, any order</label><textarea id="cfree"></textarea>`;
   $("#cgo").disabled=false;$("#cgo").textContent="Score & start Series 2";$("#cfree").focus();a=-1; }
  else if(a===-1){ a=countHits($("#cfree").value,A); if(!await show(B))return;
   $("#cin").innerHTML=`<div class="cuegrid">${Object.keys(CAT).map(c=>`<label>${c}<input data-c="${c}" aria-label="${c} words"></label>`).join("")}</div>`;
   $("#cgo").disabled=false;$("#cgo").textContent="Score Series 2";$("#cin input").focus(); }
  else { const typed=[...document.querySelectorAll("#cin input")].map(i=>i.value).join(" "); const b=countHits(typed,B);
   $("#cout").innerHTML=`Series 1 (free): <b>${a}/12</b> · Series 2 (cued): <b>${b}/12</b> · Difference = ${b} − ${a} = <b>${b-a}</b><br><span class="verdict">${b>a?"Cueing helped, hypothesis supported":"No cueing benefit this time"}</span>`;
   $("#cgo").textContent="Run again";a=null;$("#cs").textContent="Ready?";$("#cin").innerHTML=""; }
 };
},
chunkLab(el){
 const C="BCDFGHJKLMNPRSTVZ",V="AEIOU",r=s=>s[Math.random()*s.length|0],cvc=()=>r(C)+r(V)+r(C);
 const make=()=>{const s=[],k=[];for(let i=0;i<4;i++){s.push(cvc()+cvc()+cvc());k.push(cvc()+"-"+cvc()+"-"+cvc())}return [...s.map(x=>[x,0]),...k.map(x=>[x,1])]};
 let trials,i,score;
 el.innerHTML=`<p>Mini version of Experiment 2: 4 strings without chunks, then 4 chunked. Each shows for 2 s. Type the letters in order (use _ for a letter you forgot).</p>
 <div class="stage mono" id="ks">BGH-IEK-MON</div><div class="row"><input id="kin" class="mono" autocomplete="off" aria-label="Letters you saw" placeholder="type letters" disabled><button class="btn primary" id="kgo">Start</button></div><div class="out" id="kout"></div>`;
 const next=async()=>{const id=++runId;if(i>=trials.length){const n=score[0]/4,c=score[1]/4;$("#ks").textContent="Done";$("#kout").innerHTML=`Average span: non-chunked <b>${n.toFixed(1)}</b> · chunked <b>${c.toFixed(1)}</b> · D = <b>${(c-n).toFixed(1)}</b><br><span class="verdict">${c>n?"Chunking improved recall":"No chunking benefit this run"}</span>`;$("#kgo").textContent="Run again";$("#kgo").disabled=false;$("#kin").disabled=true;i=-1;return}
  $("#kin").value="";$("#kin").disabled=true;$("#kgo").disabled=true;$("#ks").textContent="●";await wait(600);if(id!==runId)return;
  $("#ks").textContent=trials[i][0];await wait(2000);if(id!==runId)return;$("#ks").textContent=`Card ${i+1}/8 · type it`;$("#kin").disabled=false;$("#kin").focus();$("#kgo").disabled=false;$("#kgo").textContent="Submit";};
 const submit=()=>{const want=trials[i][0].replace(/-/g,""),got=$("#kin").value.toUpperCase().replace(/[^A-Z_]/g,"");let s=0;for(let k=0;k<9;k++)if(got[k]===want[k])s++;score[trials[i][1]]+=s;$("#kout").textContent=`Card ${i+1}: ${s}/9 letters in the right position`;i++;next()};
 $("#kgo").onclick=()=>{if(!trials||i===-1){trials=make();i=0;score=[0,0];$("#kout").textContent="";next()}else submit()};
 $("#kin").onkeydown=e=>{if(e.key==="Enter"&&!$("#kin").disabled)submit()};
},
miqLab(el){
 const items=[["Visual","The sun setting over the sea"],["Auditory","A pressure cooker whistle"],["Gustatory","Biting into a raw lemon"],["Olfactory","Wet earth after the first rain"],["Tactual","Running your hand over velvet"],["Organic","The feeling of being very hungry"]];

["A sten of 8 is usually…",["Low","Average","High","Very low"],2,"7–8 high, 9–10 very high."],
["What does 16PF MD indicate?",["Memory deficit","Possible faking good","Mental disorder","Mean deviation"],1,"Motivational Distortion: overly favourable self-presentation."],
["The best observation note is…",["Was careless","Looked away several times during presentation","Seemed lazy","Didn't care"],1,"Write objective behaviour, not judgements."],
["You forget an exact cut-off in the viva. You should…",["Guess confidently","State the principle and say the cut-off is in the manual","Skip the question","Use another test's norms"],1,"The guide says: don't guess."],
["Eysenck said extraverts have…",["Higher cortical arousal","Lower baseline cortical arousal","No arousal differences","Larger hippocampus"],1,"Lower arousal, so they seek stimulation."]
];
let qs=[],qi=0,right=0;
function startQuiz(){qs=shuffle(QUIZ).slice(0,15).map(q=>({q:q[0],o:shuffle(q[1].map((t,k)=>({t,ok:k===q[2]}))),why:q[3]}));qi=0;right=0;drawQ()}
function drawQ(){
 if(qi>=qs.length){const pct=Math.round(right/qs.length*100),best=Math.max(pct,store.get("pl-best",0));store.set("pl-best",best);
  $("#quiz").innerHTML=`<div class="eyebrow">Result</div><div class="score">${right}/${qs.length}</div><p>${pct>=80?"Viva ready.":pct>=50?"Getting there. Re-read the units you missed.":"Go through the units first, then retry."} Best: ${best}%.</p><button class="btn primary" id="qa">New quiz</button>`;$("#qa").onclick=startQuiz;return}
 const q=qs[qi];let answered=false;
 $("#quiz").innerHTML=`<div class="eyebrow">Viva question ${qi+1} of ${qs.length} · score ${right}</div><div class="bar" style="margin:10px 0"><i style="width:${qi/qs.length*100}%"></i></div><h2 style="font-size:1.5rem">${q.q}</h2><div class="opts">${q.o.map((o,k)=>`<button data-k="${k}">${o.t}</button>`).join("")}</div><p class="hint" id="why"></p><div class="row" id="nx"></div>`;
 $("#quiz .opts").onclick=e=>{const b=e.target.closest("button");if(!b||answered)return;answered=true;const p=q.o[+b.dataset.k];
  [...$("#quiz .opts").children].forEach((x,k)=>{if(q.o[k].ok)x.classList.add("right");x.disabled=true});if(p.ok)right++;else b.classList.add("wrong");
  $("#why").textContent=(p.ok?"Correct. ":"Not quite. ")+q.why;$("#nx").innerHTML=`<button class="btn primary" id="nq">${qi+1<qs.length?"Next":"See result"}</button>`;$("#nq").onclick=()=>{qi++;drawQ()};$("#nq").focus()};
}

/* ---------- Rapport ---------- */
function rapport(){
 document.documentElement.style.setProperty("--accent","var(--per)");document.documentElement.style.setProperty("--accent-soft","var(--per-soft)");
 $("#rapport").innerHTML=`<div class="rapport-head"><div><div class="eyebrow">Before every practical</div><h2>Rapport builders</h2><p class="reading">Eight openers that get a participant talking in under two minutes. Each one has a follow-up and a line to slide into the test. None of them give away the hypothesis.</p></div><button class="btn primary" id="spin">Pick one for me</button></div>
 <div class="rgrid">${RAPPORT.map((r,k)=>`<div class="rcard" id="rc${k}"><span class="chip" style="align-self:start">${r.fit}</span><h3>${k+1}. ${r.t}</h3><p class="say">${r.say}</p><span class="lbl">Follow-up</span><p>${r.f}</p><span class="lbl">Why it works</span><p>${r.why}</p><span class="lbl">Move into the test</span><p><i>${r.to}</i></p></div>`).join("")}</div>
 <div class="tip"><b>Rapport rules from your record.</b> Warm, brief, informal. Don't reveal the nature of the experiment (especially cueing and chunking). Stay off sensitive topics before Bell's. Note how cooperative they were, then write it objectively in your discussion.</div>`;
 $("#spin").onclick=()=>{document.querySelectorAll(".rcard").forEach(c=>c.classList.remove("on"));const c=$("#rc"+(Math.random()*RAPPORT.length|0));c.classList.add("on");c.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"center"})};
}

/* ---------- Modes ---------- */
function mode(m){document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.mode===m));["units","cards","quiz","rapport"].forEach(id=>$("#"+id).hidden=id!==m);if(m==="units")unit();else runId++;if(m==="rapport")rapport();if(m==="quiz")document.documentElement.style.setProperty("--accent","var(--cog)")}
document.querySelector("nav").onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.mode==="cards"&&!deck.length)buildDeck();if(b.dataset.mode==="cards")drawCard();mode(b.dataset.mode)};
rail();unit();prog();buildDeck();startQuiz();
</script>
